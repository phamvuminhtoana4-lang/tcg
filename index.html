<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>GAME PHIÊU LƯU TOP-DOWN</title>

<style>
body{margin:0;background:#000;color:white;font-family:Arial}
canvas{display:block;margin:auto}

#ui{
 position:fixed;top:10px;left:10px;
 background:#000c;padding:10px;border-radius:10px;width:260px
}

.bar{height:12px;background:#222;border-radius:6px;margin-bottom:5px}
.hp{background:red;height:100%}
.mp{background:blue;height:100%}
.exp{background:lime;height:100%}

#inventory{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:4px;margin-top:10px
}
.slot{height:40px;background:#222;border:1px solid #555;font-size:10px;text-align:center}

#minimap{
 position:fixed;right:10px;top:10px;
 width:150px;height:150px;background:#000;border:2px solid #555
}
</style>
</head>

<body>

<div id="ui">
HP<div class="bar"><div id="hp" class="hp"></div></div>
MP<div class="bar"><div id="mp" class="mp"></div></div>
EXP<div class="bar"><div id="exp" class="exp"></div></div>
<p>Lv: <span id="lv">1</span></p>
<p id="quest"></p>
<div id="inventory"></div>
</div>

<canvas id="minimap"></canvas>
<canvas id="game" width="1000" height="600"></canvas>

<script>
// ===== SETUP =====
const c=game,ctx=c.getContext("2d");
const mini=minimap,mctx=mini.getContext("2d");

let mouse={x:0,y:0};
c.onmousemove=e=>{
 let r=c.getBoundingClientRect();
 mouse.x=e.clientX-r.left;
 mouse.y=e.clientY-r.top;
};

// ===== WORLD =====
const tile=40;
const world={w:6000,h:6000};
let map=[];

for(let y=0;y<150;y++){
 let row=[];
 for(let x=0;x<150;x++){
  let r=Math.random();
  if(r<0.1) row.push("water");
  else if(r<0.2) row.push("rock");
  else if(r<0.4) row.push("forest");
  else row.push("grass");
 }
 map.push(row);
}

function block(x,y){
 let tx=Math.floor(x/tile);
 let ty=Math.floor(y/tile);
 if(!map[ty]||!map[ty][tx]) return true;
 return ["rock","water"].includes(map[ty][tx]);
}

// ===== PLAYER =====
let p={
 x:3000,y:3000,
 hp:200,max:200,
 mp:100,maxMp:100,
 lv:1,exp:0,next:100,
 dmg:20,speed:4,
 inv:Array(25).fill(null)
};

let cam={x:0,y:0};

// ===== INPUT =====
let keys={};
onkeydown=e=>keys[e.key.toLowerCase()]=true;
onkeyup=e=>keys[e.key.toLowerCase()]=false;

// ===== ENEMY =====
let enemies=[];
function spawn(){
 let x,y;
 do{
  x=Math.random()*world.w;
  y=Math.random()*world.h;
 }while(block(x,y));

 enemies.push({
  x,y,
  hp:100,max:100,
  type:["melee","ranged"][Math.random()*2|0],
  speed:2
 });
}
for(let i=0;i<30;i++) spawn();

// ===== SKILL =====
let bullets=[];
onclick=()=>{
 let tx=mouse.x+cam.x,ty=mouse.y+cam.y;
 let dx=(tx-p.x)/20,dy=(ty-p.y)/20;

 bullets.push({x:p.x,y:p.y,dx,dy,life:60});
};

// ===== DROP =====
let drops=[];

// ===== QUEST =====
let quest={kill:0,need:10};

// ===== INVENTORY =====
function addItem(it){
 let i=p.inv.findIndex(v=>!v);
 if(i!=-1) p.inv[i]=it;
}

function drawInv(){
 let div=inventory;
 div.innerHTML="";
 p.inv.forEach(it=>{
  div.innerHTML+=`<div class="slot">${it?it.type:""}</div>`;
 });
}

// ===== UPDATE =====
function update(){

 // MOVE
 let nx=p.x,ny=p.y;
 if(keys["w"]) ny-=p.speed;
 if(keys["s"]) ny+=p.speed;
 if(keys["a"]) nx-=p.speed;
 if(keys["d"]) nx+=p.speed;

 if(!block(nx,p.y)) p.x=nx;
 if(!block(p.x,ny)) p.y=ny;

 cam.x=p.x-c.width/2;
 cam.y=p.y-c.height/2;

 // ENEMY
 enemies.forEach(e=>{
  let dx=p.x-e.x,dy=p.y-e.y;
  let d=Math.hypot(dx,dy);
  if(d<400){
   e.x+=dx/d*e.speed;
   e.y+=dy/d*e.speed;
  }
  if(d<30) p.hp-=0.2;
 });

 // BULLET
 bullets.forEach((b,i)=>{
  b.x+=b.dx;b.y+=b.dy;b.life--;

  enemies.forEach(e=>{
   if(Math.hypot(e.x-b.x,e.y-b.y)<20){
    e.hp-=p.dmg;
    b.life=0;
   }
  });

  if(b.life<=0) bullets.splice(i,1);
 });

 // KILL
 enemies=enemies.filter(e=>{
  if(e.hp<=0){
   quest.kill++;
   drops.push({x:e.x,y:e.y,type:"hp"});
   spawn();
   return false;
  }
  return true;
 });

 // PICK
 drops.forEach((d,i)=>{
  if(Math.hypot(p.x-d.x,p.y-d.y)<30){
   p.hp=Math.min(p.max,p.hp+30);
   drops.splice(i,1);
  }
 });

 // LEVEL
 if(p.exp>=p.next){
  p.exp=0;p.lv++;p.next*=1.5;
 }

 // DEATH
 if(p.hp<=0){
  alert("💀 Bạn đã chết");
  p.hp=p.max;
  p.x=3000;p.y=3000;
 }

 // UI
 hp.style.width=p.hp/p.max*100+"%";
 mp.style.width=p.mp/p.maxMp*100+"%";
 exp.style.width=p.exp/p.next*100+"%";
 lv.innerText=p.lv;
 quest.innerText=`Nhiệm vụ: ${quest.kill}/${quest.need}`;
 drawInv();
}

// ===== DRAW =====
function draw(){
 ctx.clearRect(0,0,c.width,c.height);

 // MAP
 for(let y=0;y<map.length;y++){
  for(let x=0;x<map[y].length;x++){
   let t=map[y][x];
   let px=x*tile-cam.x,py=y*tile-cam.y;

   if(px<-40||py<-40||px>c.width||py>c.height) continue;

   ctx.fillStyle=
    t==="grass"?"#2ecc71":
    t==="forest"?"#145a32":
    t==="rock"?"#777":"#3498db";

   ctx.fillRect(px,py,tile,tile);
  }
 }

 // PLAYER
 ctx.fillStyle="cyan";
 ctx.fillRect(p.x-cam.x,p.y-cam.y,20,20);

 // ENEMY
 enemies.forEach(e=>{
  ctx.fillStyle=e.type==="ranged"?"yellow":"red";
  ctx.fillRect(e.x-cam.x,e.y-cam.y,20,20);
 });

 // BULLET
 ctx.fillStyle="white";
 bullets.forEach(b=>{
  ctx.fillRect(b.x-cam.x,b.y-cam.y,5,5);
 });

 // DROP
 ctx.fillStyle="orange";
 drops.forEach(d=>{
  ctx.fillRect(d.x-cam.x,d.y-cam.y,10,10);
 });

 // MINIMAP
 mctx.clearRect(0,0,150,150);
 mctx.fillStyle="white";
 mctx.fillRect(p.x/world.w*150,p.y/world.h*150,4,4);
}

// ===== LOOP =====
function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
