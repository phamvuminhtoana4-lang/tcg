<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>VÕ LÂM SUPREME: SIÊU CẤP AI</title>
    <style>
        :root {
            --gold: #FFD700; --silver: #C0C0C0; --ui-bg: rgba(15, 15, 15, 0.95);
            --hp-boss: #ff1100; --exp-color: #00ff88; --sect-color: #00d4ff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; color: #fff; }

        /* --- WORLD ENGINE --- */
        #viewport { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
        #map { 
            position: absolute; width: 100000px; height: 100000px; 
            background: #080808 radial-gradient(#1a1a1a 1px, transparent 1px); 
            background-size: 120px 120px; will-change: transform;
        }

        .island { 
            position: absolute; border-radius: 50%; border: 15px solid rgba(255,215,0,0.03);
            background: radial-gradient(circle, rgba(30,30,30,0.8), transparent);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .island-label { font-size: 160px; color: rgba(255,255,255,0.02); font-weight: 900; text-transform: uppercase; pointer-events: none; }

        /* --- ENTITIES --- */
        .entity { position: absolute; width: 50px; height: 70px; z-index: 100; pointer-events: none; }
        .stickman { position: relative; width: 100%; height: 100%; }
        .head { position: absolute; width: 20px; height: 20px; border: 2.5px solid #fff; border-radius: 50%; top: 0; left: 15px; background: #000; }
        .body-line { position: absolute; width: 2.5px; height: 30px; background: #fff; top: 20px; left: 24px; }
        .arm { position: absolute; width: 22px; height: 2.5px; background: #fff; top: 25px; left: 24px; transform-origin: left; transition: 0.1s; }
        .leg { position: absolute; width: 22px; height: 2.5px; background: #fff; top: 48px; left: 24px; transform-origin: left; }
        
        .elite .head { border-color: #ff3300; box-shadow: 0 0 15px #ff3300; }
        .elite .body-line { background: #ff3300; }
        
        .boss { width: 150px; height: 220px; z-index: 200; }
        .boss .head { width: 60px; height: 60px; border-width: 6px; border-color: #ff0000; left: 45px; box-shadow: 0 0 30px #ff0000; }
        .boss .body-line { width: 8px; height: 100px; left: 71px; top: 60px; background: #ff0000; }

        .npc-tag { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); font-size: 11px; white-space: nowrap; font-weight: bold; text-shadow: 1px 1px 2px #000; padding: 2px 5px; border-radius: 3px; background: rgba(0,0,0,0.5); }
        
        /* --- CHAT SYSTEM --- */
        #chat-main { position: fixed; bottom: 20px; left: 20px; width: 320px; height: 200px; background: rgba(0, 0, 0, 0.85); border: 1px solid #444; border-radius: 8px; z-index: 2000; display: flex; flex-direction: column; transition: 0.3s; }
        #chat-main.minimized { height: 35px; width: 160px; overflow: hidden; }
        #chat-top { background: #222; padding: 8px; cursor: pointer; display: flex; justify-content: space-between; font-size: 12px; color: var(--gold); border-radius: 8px 8px 0 0; }
        #chat-list { flex: 1; padding: 10px; overflow-y: auto; font-size: 12px; color: #ddd; }
        .c-msg { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* --- VFX --- */
        .fx-aoe { position: absolute; border-radius: 50%; border: 4px solid var(--gold); background: rgba(255,215,0,0.1); transform: translate(-50%, -50%) scale(0); animation: aoe-anim 0.5s ease-out forwards; pointer-events: none; }
        @keyframes aoe-anim { to { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
        .fx-slash { position: absolute; width: 120px; height: 20px; background: linear-gradient(90deg, transparent, #fff, transparent); transform: translate(-50%, -50%); animation: slash-anim 0.2s linear forwards; pointer-events: none; }
        @keyframes slash-anim { 0% { opacity: 1; transform: translate(-50%, -50%) scaleX(0); } 100% { opacity: 0; transform: translate(-50%, -50%) scaleX(1.5); } }

        /* --- HUD --- */
        .hud-left { position: fixed; top: 20px; left: 20px; z-index: 1000; }
        .player-box { background: var(--ui-bg); border-left: 5px solid var(--gold); padding: 15px; border-radius: 0 10px 10px 0; min-width: 250px; }
        .bar-bg { width: 100%; height: 6px; background: #222; margin: 8px 0; border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; transition: width 0.3s; }
        
        #boss-hud { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); width: 500px; display: none; z-index: 1100; text-align: center; }
        .boss-hp-bg { width: 100%; height: 12px; background: #200; border: 1px solid #ff4444; border-radius: 6px; overflow: hidden; }
        #boss-hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #600, #f00); }

        .menu-right { position: fixed; right: 20px; top: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1001; }
        .circle-btn { width: 60px; height: 60px; background: var(--ui-bg); border: 1px solid #333; border-radius: 50%; color: var(--gold); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .panel { position: fixed; right: 90px; top: 20px; width: 350px; height: 500px; background: var(--ui-bg); border: 1px solid #444; border-radius: 15px; display: none; flex-direction: column; padding: 20px; z-index: 1002; }
        .panel-title { color: var(--gold); font-size: 20px; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }

        #joy-base { position: fixed; bottom: 60px; left: 60px; width: 140px; height: 140px; background: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; }
        #joy-stick { position: absolute; width: 60px; height: 60px; background: rgba(255,255,255,0.15); border-radius: 50%; top: 40px; left: 40px; }
        .action-cluster { position: fixed; bottom: 40px; right: 40px; display: flex; flex-direction: column; gap: 20px; align-items: flex-end; }
        .main-atk { width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, #800, #300); border: 4px solid #fff; color: #fff; font-size: 22px; font-weight: bold; cursor: pointer; }
        .skill-grid { display: flex; gap: 12px; }
        .skill-node { width: 65px; height: 65px; border-radius: 50%; background: #151515; border: 2px solid var(--gold); color: var(--gold); font-size: 11px; cursor: pointer; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; }
        .cd-mask { position: absolute; bottom: 0; width: 100%; height: 0%; background: rgba(0,0,0,0.7); }

        #radar { width: 100%; height: 250px; background: #000; border: 1px solid #333; position: relative; overflow: hidden; border-radius: 10px; }
        .dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; transform: translate(-50%, -50%); }

        #start-gate { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .gate-btn { padding: 20px 80px; background: none; border: 2px solid var(--gold); color: var(--gold); font-size: 24px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="start-gate">
    <h1 style="color:var(--gold); font-size: 60px; margin:0;">VÕ LÂM SUPREME</h1>
    <p style="letter-spacing: 15px; color: #555;">SIÊU CẤP AI PHIÊN BẢN</p>
    <button class="gate-btn" onclick="startGame()">BƯỚC VÀO GIANG HỒ</button>
</div>

<div id="boss-hud">
    <div id="boss-title" style="color:#ff4444; font-weight:bold;">MA VƯƠNG CHIẾN THẦN (LV.99)</div>
    <div class="boss-hp-bg"><div id="boss-hp-fill"></div></div>
</div>

<div id="viewport">
    <div id="map">
        <div id="sect-layer"></div>
        <div id="mob-layer"></div>
        <div id="hero" class="entity">
            <div class="stickman">
                <div class="npc-tag" style="color:var(--gold)">Đại Hiệp</div>
                <div class="head" style="border-color: var(--gold);"></div>
                <div class="body-line"></div>
                <div class="arm" id="arm-l"></div>
                <div class="arm" id="arm-r"></div>
                <div class="leg"></div><div class="leg"></div>
            </div>
        </div>
    </div>
</div>

<div class="hud-left">
    <div class="player-box">
        <div style="display:flex; justify-content:space-between;">
            <span id="ui-sect" style="color:var(--gold); font-weight:bold;">Vô Danh</span>
            <span>Cấp <span id="ui-lv">1</span></span>
        </div>
        <div class="bar-bg"><div id="ui-exp" class="bar-fill" style="background: var(--exp-color);"></div></div>
        <div style="font-size:14px;">Bạc: <b id="ui-money">0</b> | LC: <b id="ui-pow">10</b></div>
    </div>
</div>

<div id="chat-main">
    <div id="chat-top" onclick="toggleChat()"><span>💬 KÊNH THẾ GIỚI</span><span id="chat-icon">▼</span></div>
    <div id="chat-list"></div>
</div>

<div class="menu-right">
    <div class="circle-btn" onclick="openPanel('pan-map')">🧭</div>
    <div class="circle-btn" onclick="openPanel('pan-shop')">🛒</div>
    <div class="circle-btn" onclick="openPanel('pan-bag')">🎒</div>
</div>

<div id="pan-map" class="panel">
    <div class="panel-title">THIÊN ĐỊA ĐỒ <span onclick="closePanels()" style="float:right; cursor:pointer">×</span></div>
    <div id="radar"><div id="radar-p" class="dot" style="background:red; border:1px solid #fff; z-index:10;"></div></div>
</div>

<div id="pan-shop" class="panel">
    <div class="panel-title">TIỆM RÈN TÔNG MÔN <span onclick="closePanels()" style="float:right; cursor:pointer">×</span></div>
    <div id="shop-content"></div>
</div>

<div id="pan-bag" class="panel">
    <div class="panel-title">HÀNH TRANG <span onclick="closePanels()" style="float:right; cursor:pointer">×</span></div>
    <div id="bag-content"></div>
</div>

<div id="joy-base"><div id="joy-stick"></div></div>
<div class="action-cluster">
    <div class="skill-grid" id="skill-bar"></div>
    <button class="main-atk" onclick="useSkill('Normal')">ĐÁNH</button>
</div>

<script>
    const WORLD_SIZE = 100000;
    const SECTS = {
        'Thiếu Lâm': { x: 15000, y: 15000, color: '#f1c40f', item: 'Thiết Bổng', price: 200, pow: 50, skill: 'Sư Tử Hống', type: 'AOE', lines: ["Nam mô a di đà phật!", "Quay đầu là bờ!"] },
        'Võ Đang': { x: 85000, y: 15000, color: '#3498db', item: 'Thanh Kiếm', price: 250, pow: 60, skill: 'Thái Cực Kiếm', type: 'PROJ', lines: ["Thái cực sinh lưỡng nghi...", "Võ Đang vô song!"] },
        'Đường Môn': { x: 50000, y: 85000, color: '#2ecc71', item: 'Ám Khí', price: 300, pow: 55, skill: 'Bạo Vũ Lê Hoa', type: 'MULTI', lines: ["Ám khí vô hình!", "Đừng để ta nhắm trúng."] }
    };

    let player = { x: 2000, y: 2000, lv: 1, exp: 0, money: 500, pow: 10, speed: 13, sects: [], skills: [], items: [], cds: {}, dir: {x:0, y:0}, lastDir: {x:1, y:0}, isAtk: false };
    let mobs = [];
    let boss = null;
    let aiEntities = []; 

    function startGame() {
        document.getElementById('start-gate').style.display = 'none';
        initMap();
        spawnBoss();
        initNPCs();
        for(let i=0; i<100; i++) spawnMob('normal');
        requestAnimationFrame(gameLoop);
        setInterval(aiLogicTick, 100); 
        setInterval(aiSpeechTick, 4000); 
    }

    function initMap() {
        const sectLayer = document.getElementById('sect-layer');
        const radar = document.getElementById('radar');
        Object.keys(SECTS).forEach(name => {
            const s = SECTS[name];
            const isl = document.createElement('div');
            isl.className = 'island';
            isl.style.left = (s.x - 3000) + 'px'; isl.style.top = (s.y - 3000) + 'px';
            isl.style.width = isl.style.height = '6000px';
            isl.innerHTML = `<div class="island-label">${name}</div>`;
            sectLayer.appendChild(isl);

            const dot = document.createElement('div');
            dot.className = 'dot'; dot.style.background = s.color;
            dot.style.left = (s.x/WORLD_SIZE*100)+'%'; dot.style.top = (s.y/WORLD_SIZE*100)+'%';
            radar.appendChild(dot);
        });
    }

    function initNPCs() {
        Object.keys(SECTS).forEach(sName => {
            for(let i=0; i<3; i++) createAI(SECTS[sName].x + (Math.random()-0.5)*1500, SECTS[sName].y + (Math.random()-0.5)*1500, sName + " Đệ Tử", SECTS[sName].color, 'patrol', SECTS[sName].lines);
        });
    }

    function createAI(x, y, name, color, behavior, lines) {
        const id = 'ai-' + Math.random();
        const html = `<div id="${id}" class="entity" style="left:${x}px; top:${y}px"><div class="stickman"><div class="npc-tag" style="color:${color}">${name}</div><div class="head" style="border-color:${color}"></div><div class="body-line"></div></div></div>`;
        document.getElementById('mob-layer').insertAdjacentHTML('beforeend', html);
        aiEntities.push({ id, x, y, startX: x, startY: y, name, color, behavior, lines, speed: 4 });
    }

    function aiLogicTick() {
        aiEntities.forEach(n => {
            const el = document.getElementById(n.id);
            if(!el) return;
            n.x += (Math.random()-0.5)*20; n.y += (Math.random()-0.5)*20;
            if(Math.hypot(n.x - n.startX, n.y - n.startY) > 2000) { n.x = n.startX; n.y = n.startY; }
            el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
        });
    }

    function spawnMob(type) {
        const id = 'm-' + Math.random();
        const mx = player.x + (Math.random()-0.5)*4000;
        const my = player.y + (Math.random()-0.5)*4000;
        const html = `<div id="${id}" class="entity" style="left:${mx}px; top:${my}px; opacity:0.7;"><div class="stickman"><div class="head"></div><div class="body-line"></div></div></div>`;
        document.getElementById('mob-layer').insertAdjacentHTML('beforeend', html);
        mobs.push({ id, x: mx, y: my, hp: 30 });
    }

    function spawnBoss() {
        const bx = 50000, by = 50000;
        const html = `<div id="boss-ent" class="entity boss" style="left:${bx}px; top:${by}px"><div class="stickman"><div class="npc-tag" style="color:red">MA VƯƠNG</div><div class="head"></div><div class="body-line"></div></div></div>`;
        document.getElementById('mob-layer').insertAdjacentHTML('beforeend', html);
        boss = { id: 'boss-ent', x: bx, y: by, hp: 15000, maxHp: 15000 };
    }

    function useSkill(type) {
        if(player.cds[type] || player.isAtk) return;
        if(type === 'Normal') {
            player.isAtk = true;
            createFX(player.x + player.lastDir.x*60, player.y + player.lastDir.y*60, 'fx-slash');
            checkHit(200);
            setTimeout(() => { player.isAtk = false; }, 150);
        } else {
            const s = Object.values(SECTS).find(s => s.skill === type);
            if(s.type === 'AOE') { createFX(player.x, player.y, 'fx-aoe', 600); checkHit(600); }
            startCD(type, 3000);
        }
    }

    function checkHit(range) {
        mobs.forEach((m, i) => {
            if(Math.hypot(player.x - m.x, player.y - m.y) < range) {
                m.hp -= player.pow;
                if(m.hp <= 0) {
                    document.getElementById(m.id)?.remove();
                    mobs.splice(i, 1);
                    player.exp += 20; player.money += 10;
                    spawnMob();
                    updateUI();
                }
            }
        });
        if(boss && Math.hypot(player.x - boss.x, player.y - boss.y) < range + 100) {
            document.getElementById('boss-hud').style.display = 'block';
            boss.hp -= player.pow;
            document.getElementById('boss-hp-fill').style.width = (boss.hp/boss.maxHp*100)+'%';
            if(boss.hp <= 0) {
                addChat("Hệ thống", "MA VƯƠNG ĐÃ BỊ TIÊU DIỆT!", "red");
                document.getElementById(boss.id).remove();
                boss = null;
                player.money += 1000; updateUI();
            }
        }
    }

    function createFX(x, y, cls, size=120) {
        const f = document.createElement('div'); f.className = cls; 
        f.style.left = x+'px'; f.style.top = y+'px';
        if(cls === 'fx-aoe') { f.style.width = f.style.height = size+'px'; }
        document.getElementById('map').appendChild(f); 
        setTimeout(() => f.remove(), 500);
    }

    function startCD(skill, ms) {
        player.cds[skill] = true;
        const m = document.getElementById('mask-'+skill);
        if(m) { m.style.height = '100%'; setTimeout(() => { m.style.transition = `height ${ms}ms linear`; m.style.height = '0%'; }, 50); }
        setTimeout(() => player.cds[skill] = false, ms);
    }

    function updateUI() {
        if(player.exp >= 100) { player.lv++; player.exp = 0; player.pow += 15; addChat("Hệ thống", "Thăng cấp " + player.lv, "lime"); }
        document.getElementById('ui-lv').innerText = player.lv;
        document.getElementById('ui-money').innerText = player.money;
        document.getElementById('ui-pow').innerText = player.pow;
        document.getElementById('ui-exp').style.width = player.exp + '%';
        updateShop();
    }

    function updateShop() {
        let near = Object.keys(SECTS).find(n => Math.hypot(player.x - SECTS[n].x, player.y - SECTS[n].y) < 3500);
        const cont = document.getElementById('shop-content');
        if(near) {
            const s = SECTS[near];
            cont.innerHTML = `<div style="padding:10px; border:1px solid gold;"><b>${near}</b><p>Vũ khí: ${s.item} (${s.price} Bạc)</p><button onclick="buyItem('${near}')">MUA</button><button onclick="learnSkill('${near}')">HỌC VÕ</button></div>`;
        } else { cont.innerHTML = `<p>Hãy đến gần Tông môn</p>`; }
    }

    function buyItem(n) {
        const s = SECTS[n];
        if(player.money >= s.price) { player.money -= s.price; player.pow += s.pow; player.items.push(s.item); updateUI(); updateBag(); }
    }

    function learnSkill(n) {
        const s = SECTS[n];
        if(!player.sects.includes(n)) {
            player.sects.push(n);
            const btn = `<button class="skill-node" onclick="useSkill('${s.skill}')">${s.skill}<div id="mask-${s.skill}" class="cd-mask"></div></button>`;
            document.getElementById('skill-bar').insertAdjacentHTML('beforeend', btn);
        }
    }

    function updateBag() { document.getElementById('bag-content').innerHTML = player.items.map(i => `<p>🗡️ ${i}</p>`).join(''); }
    function openPanel(id) { closePanels(); document.getElementById(id).style.display = 'flex'; }
    function closePanels() { document.querySelectorAll('.panel').forEach(p => p.style.display = 'none'); }
    function addChat(n, t, c) { const l = document.getElementById('chat-list'); l.innerHTML += `<div class="c-msg"><b style="color:${c}">[${n}]:</b> ${t}</div>`; l.scrollTop = l.scrollHeight; }
    function toggleChat() { const c = document.getElementById('chat-main'); c.classList.toggle('minimized'); }
    function aiSpeechTick() { if(aiEntities.length > 0) { const n = aiEntities[Math.floor(Math.random()*aiEntities.length)]; addChat(n.name, n.lines[0], n.color); } }

    const joyB = document.getElementById('joy-base');
    const joyS = document.getElementById('joy-stick');
    joyB.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const r = joyB.getBoundingClientRect(), t = e.touches[0];
            let x = t.clientX - r.left - 70, y = t.clientY - r.top - 70;
        const d = Math.hypot(x, y);
        if(d > 50) { x *= 50/d; y *= 50/d; }
        joyS.style.left = (x+40)+'px'; joyS.style.top = (y+40)+'px';
        player.dir = { x: x/50, y: y/50 };
        if(d > 5) player.lastDir = { x: x/d, y: y/d };
    });

    joyB.addEventListener('touchend', () => { 
        player.dir = {x:0, y:0}; 
        joyS.style.left = '40px'; 
        joyS.style.top = '40px'; 
    });

    function gameLoop() {
        // Cập nhật vị trí nhân vật
        player.x += player.dir.x * player.speed;
        player.y += player.dir.y * player.speed;
        
        // Giới hạn trong bản đồ
        player.x = Math.max(0, Math.min(WORLD_SIZE, player.x));
        player.y = Math.max(0, Math.min(WORLD_SIZE, player.y));

        const h = document.getElementById('hero');
        h.style.left = player.x+'px'; 
        h.style.top = player.y+'px';
        
        // Camera di chuyển theo nhân vật
        document.getElementById('map').style.transform = `translate(${window.innerWidth/2 - player.x}px, ${window.innerHeight/2 - player.y}px)`;
        
        // Xoay hướng nhân vật
        if(player.dir.x !== 0) h.style.transform = `scaleX(${player.dir.x > 0 ? 1 : -1})`;
        
        // Cập nhật vị trí trên Mini-map (Radar)
        const rp = document.getElementById('radar-p');
        if(rp) { 
            rp.style.left = (player.x/WORLD_SIZE*100)+'%'; 
            rp.style.top = (player.y/WORLD_SIZE*100)+'%'; 
        }

        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
