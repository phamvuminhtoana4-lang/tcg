<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>VÕ LÂM SUPREME: THIÊN ĐẠO VÔ HẠN</title>
    <style>
        :root { --gold: #FFD700; --hp: #ff3232; --exp: #cc32ff; --bg: #050505; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: 'Tahoma', sans-serif; color: #eee; }

        /* WORLD ENGINE 80.000px */
        #viewport { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #game-map { position: absolute; width: 80000px; height: 80000px; background: #0a0a0a url('https://www.transparenttextures.com/patterns/dark-matter.png'); transition: transform 0.15s linear; }

        /* TÔNG MÔN LÃNH THỔ */
        .sect-zone { position: absolute; border: 30px solid rgba(255,215,0,0.03); border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .sect-name { font-size: 300px; color: rgba(255,215,0,0.015); font-weight: 900; white-space: nowrap; }

        /* NHÂN VẬT CHÍNH */
        .stickman { position: absolute; width: 40px; height: 60px; z-index: 100; pointer-events: none; }
        .head { position: absolute; width: 18px; height: 18px; border: 2px solid #fff; border-radius: 50%; top: 0; left: 11px; background: #000; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .body { position: absolute; width: 2px; height: 26px; background: #fff; top: 18px; left: 19px; }
        .arm, .leg { position: absolute; width: 22px; height: 2px; background: #fff; top: 22px; left: 19px; transform-origin: left; }
        .leg { top: 44px; }
        .weapon { position: absolute; width: 35px; height: 3px; background: var(--gold); top: -1px; left: 18px; transform: rotate(90deg); box-shadow: 0 0 15px var(--gold); display: none; }

        /* HIỆU ỨNG CHIÊU THỨC */
        .fx-ring { position: absolute; border-radius: 50%; border: 4px solid var(--gold); animation: expand 0.6s ease-out forwards; pointer-events: none; }
        @keyframes expand { from { transform: scale(0); opacity: 1; } to { transform: scale(10); opacity: 0; } }

        /* UI HỆ THỐNG */
        .ui { position: fixed; background: rgba(0,0,0,0.9); border: 2px solid var(--gold); border-radius: 12px; padding: 15px; z-index: 1000; }
        .status { top: 20px; left: 20px; width: 280px; }
        .mini-map { top: 20px; right: 350px; width: 160px; height: 160px; border: 1px solid #555; overflow: hidden; }
        #m-dot { position: absolute; width: 6px; height: 6px; background: red; border-radius: 50%; box-shadow: 0 0 5px red; }
        .rankings { top: 20px; right: 20px; width: 300px; max-height: 300px; }

        /* CƠ DUYÊN PANEL */
        #invite-ui { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 450px; background: #151515; border: 5px ridge var(--gold); 
            padding: 30px; text-align: center; display: none; z-index: 2000; box-shadow: 0 0 50px #000;
        }
        .btn-choice { padding: 12px 30px; margin: 15px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; font-size: 16px; }
        .btn-accept { background: var(--gold); color: #000; }
        .btn-decline { background: #444; color: #fff; }

        /* CONTROLS */
        #joystick { position: fixed; bottom: 50px; left: 50px; width: 140px; height: 140px; background: rgba(255,255,255,0.05); border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); }
        #stick { position: absolute; width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 50%; top: 40px; left: 40px; border: 2px solid #fff; }
        .skill-bar { position: fixed; bottom: 40px; right: 40px; display: flex; gap: 15px; flex-wrap: wrap-reverse; max-width: 400px; justify-content: flex-end; }
        .skill-btn { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--gold); background: #221a0f; color: var(--gold); font-weight: bold; font-size: 11px; cursor: pointer; box-shadow: 0 5px 15px #000; }
    </style>
</head>
<body>

<div id="viewport">
    <div id="game-map">
        <div id="sect-layers"></div>
        <div id="mob-layers"></div>
        <div id="hero" class="stickman">
            <div id="p-tag" style="position:absolute; top:-40px; width:200px; text-align:center; left:-80px; font-size:12px; color:var(--gold); text-shadow:1px 1px #000;">[Cấp 1] Tân Thủ</div>
            <div class="head"></div><div class="body"></div>
            <div class="arm" id="arm-l" style="transform:rotate(140deg)"></div>
            <div class="arm" id="arm-r" style="transform:rotate(-40deg)"><div class="weapon" id="p-weapon"></div></div>
            <div class="leg" style="transform:rotate(110deg)"></div><div class="leg" style="transform:rotate(70deg)"></div>
        </div>
    </div>
</div>

<div class="ui status">
    <div id="ui-sects" style="color:var(--gold); font-weight:bold; font-size:18px; margin-bottom:5px;">Vô Phái</div>
    <div style="font-size:13px;">Cảnh Giới: <span id="ui-lv">1</span> | Lực Chiến: <span id="ui-pow">100</span></div>
    <div style="height:10px; background:#222; margin-top:8px; border-radius:5px; overflow:hidden; border:1px solid #444;"><div id="ui-exp" style="height:100%; width:0%; background:var(--exp); transition: 0.3s"></div></div>
    <div id="ui-slots" style="font-size:10px; color:#888; margin-top:5px;">Cơ duyên đa phái: 0/1</div>
</div>

<div class="ui mini-map"><div id="m-dot"></div></div>

<div class="ui rankings">
    <div style="text-align:center; color:var(--gold); border-bottom:1px solid #444; padding-bottom:5px; margin-bottom:10px; font-weight:bold;">THIÊN BẢNG VÕ LÂM</div>
    <div id="rank-list"></div>
</div>

<div id="invite-ui">
    <h1 id="inv-sect-name" style="color:var(--gold); margin:0;">CƠ DUYÊN!</h1>
    <p id="inv-msg" style="line-height:1.6; font-size:16px;">Bạn gặp được vị tiền bối...</p>
    <button class="btn-choice btn-accept" onclick="acceptSect()">GIA NHẬP</button>
    <button class="btn-choice btn-decline" onclick="declineSect()">TỪ CHỐI</button>
</div>

<div id="joystick"><div id="stick"></div></div>
<div class="skill-bar" id="skill-bar">
    <button class="skill-btn" style="width:100px; height:100px; background:#800; color:#fff; font-size:18px;" onclick="attack()">ĐÁNH</button>
</div>

<script>
    const SECT_DB = {
        'Thiếu Lâm': { x: 10000, y: 10000, skill: 'Sư Tử Hống', color: 'orange', power: 250000 },
        'Võ Đang': { x: 40000, y: 10000, skill: 'Thái Cực Kiếm', color: 'cyan', power: 280000 },
        'Nga Mi': { x: 70000, y: 10000, skill: 'Cửu Âm Trảo', color: 'pink', power: 240000 },
        'Cái Bang': { x: 10000, y: 40000, skill: 'Hàng Long Chưởng', color: 'red', power: 260000 },
        'Đường Môn': { x: 40000, y: 40000, skill: 'Bạo Vũ Lê Hoa', color: 'lime', power: 230000 },
        'Côn Lôn': { x: 70000, y: 40000, skill: 'Côn Lôn Kiếm', color: '#fff', power: 270000 },
        'Minh Giáo': { x: 10000, y: 70000, skill: 'Càn Khôn Na Di', color: '#f0f', power: 290000 },
        'Ma Giáo': { x: 70000, y: 70000, skill: 'Quỳ Hoa Bảo Điển', color: '#600', power: 350000 }
    };

    let p = { x: 10500, y: 10500, lv: 1, exp: 0, pow: 100, sects: [], skills: [], dir:{x:0,y:0}, speed: 7, pending: null };
    let mobs = [];

    function init() {
        Object.keys(SECT_DB).forEach(name => {
            const s = SECT_DB[name];
            const zone = document.createElement('div');
            zone.className = 'sect-zone';
            zone.style.left = (s.x - 4500) + 'px'; zone.style.top = (s.y - 4500) + 'px';
            zone.style.width = zone.style.height = '9000px';
            zone.innerHTML = `<div class="sect-name">${name}</div>`;
            document.getElementById('sect-layers').appendChild(zone);
        });

        for(let i=0; i<200; i++) spawnMob();
        updateRanks();
        loop();
    }

    function spawnMob() {
        const id = 'mob-' + Math.random();
        const mx = Math.random() * 80000;
        const my = Math.random() * 80000;
        const html = `<div id="${id}" class="stickman" style="left:${mx}px; top:${my}px; opacity:0.7">
            <div class="head" style="border-color:red"></div><div class="body" style="background:red"></div>
        </div>`;
        document.getElementById('mob-layers').insertAdjacentHTML('beforeend', html);
        mobs.push({ id, x: mx, y: my, hp: 100 });
    }

    // JOYSTICK LOGIC
    const joy = document.getElementById('joystick');
    const stick = document.getElementById('stick');
    joy.addEventListener('touchstart', e => handleJoy(e));
    joy.addEventListener('touchmove', e => handleJoy(e));
    joy.addEventListener('touchend', () => { p.dir={x:0,y:0}; stick.style.left=stick.style.top='40px'; });

    function handleJoy(e) {
        e.preventDefault();
        const r = joy.getBoundingClientRect();
        const t = e.touches[0];
        let x = t.clientX - r.left - 70; let y = t.clientY - r.top - 70;
        const d = Math.hypot(x, y);
        if(d > 50) { x *= 50/d; y *= 50/d; }
        stick.style.left = (x+40)+'px'; stick.style.top = (y+40)+'px';
        p.dir = { x: x/50, y: y/50 };
    }

    function checkCơDuyên() {
        if(p.pending) return;
        const slotDungTích = Math.floor(p.lv / 30) + 1;
        
        Object.keys(SECT_DB).forEach(name => {
            const s = SECT_DB[name];
            const dist = Math.hypot(p.x - s.x, p.y - s.y);
            if(dist < 2000 && !p.sects.includes(name) && p.sects.length < slotDungTích) {
                p.pending = name;
                document.getElementById('invite-ui').style.display = 'block';
                document.getElementById('inv-sect-name').innerText = `CƠ DUYÊN: ${name}`;
                document.getElementById('inv-msg').innerText = `Tại lãnh thổ ${name}, tiền bối thấy cốt cách ngươi phi phàm. Có muốn gia nhập để học ${s.skill}? (Hiện tại bạn có thể học tối đa ${slotDungTích} môn phái)`;
            }
        });
    }

    function acceptSect() {
        p.sects.push(p.pending);
        p.skills.push(SECT_DB[p.pending].skill);
        p.pow += 5000;
        updateUI();
        declineSect();
    }

    function declineSect() {
        document.getElementById('invite-ui').style.display = 'none';
        setTimeout(() => p.pending = null, 5000); // Tạm dừng mời phái này trong 5s
    }

    function attack() {
        // Effect
        const ring = document.createElement('div');
        ring.className = 'fx-ring';
        ring.style.left = p.x + 'px'; ring.style.top = p.y + 'px';
        document.getElementById('game-map').appendChild(ring);
        setTimeout(() => ring.remove(), 600);

        mobs.forEach((m, i) => {
            if(Math.hypot(p.x - m.x, p.y - m.y) < 200) {
                const el = document.getElementById(m.id);
                if(el) el.remove();
                mobs.splice(i, 1);
                p.exp += 20; checkLv();
                spawnMob();
            }
        });
    }

    function checkLv() {
        if(p.exp >= 100) { p.lv++; p.exp = 0; p.pow += 1200; updateRanks(); updateUI(); }
        document.getElementById('ui-exp').style.width = p.exp + '%';
        document.getElementById('ui-lv').innerText = p.lv;
        document.getElementById('ui-pow').innerText = Math.floor(p.pow);
    }

    function updateUI() {
        document.getElementById('ui-sects').innerText = p.sects.join(' | ') || 'Vô Phái';
        document.getElementById('p-tag').innerText = `[Cấp ${p.lv}] ${p.sects[p.sects.length-1] || 'Tân Thủ'}`;
        document.getElementById('ui-slots').innerText = `Cơ duyên đa phái: ${p.sects.length}/${Math.floor(p.lv/30)+1}`;
        if(p.sects.length > 0) document.getElementById('p-weapon').style.display = 'block';

        const bar = document.getElementById('skill-bar');
        const atkBtn = bar.children[0];
        bar.innerHTML = ''; bar.appendChild(atkBtn);
        p.skills.forEach(s => {
            const b = document.createElement('button');
            b.className = 'skill-btn'; b.innerText = s;
            b.onclick = () => { attack(); p.exp += 5; checkLv(); };
            bar.appendChild(b);
        });
    }

    function updateRanks() {
        const top = Object.keys(SECT_DB).map(s => ({n: "Sư Phụ " + s, p: SECT_DB[s].power, s}));
        top.push({n: 'Đại Hiệp (Bạn)', p: p.pow, s: 'Player'});
        const sorted = top.sort((a,b) => b.p - a.p);
        document.getElementById('rank-list').innerHTML = sorted.map((r, i) => `
            <div style="font-size:11px; padding:5px; color:${r.n.includes('Bạn')?'var(--gold)':'#777'}">
                Top ${i+1}: ${r.n} - ${Math.floor(r.p)} LC
            </div>
        `).join('');
    }

    function loop() {
        p.x += p.dir.x * p.speed; p.y += p.dir.y * p.speed;
        p.x = Math.max(0, Math.min(80000, p.x)); p.y = Math.max(0, Math.min(80000, p.y));

        const h = document.getElementById('hero');
        h.style.left = p.x + 'px'; h.style.top = p.y + 'px';
        document.getElementById('game-map').style.transform = `translate(${window.innerWidth/2 - p.x}px, ${window.innerHeight/2 - p.y}px)`;
        
        document.getElementById('m-dot').style.left = (p.x / 80000 * 160) + 'px';
        document.getElementById('m-dot').style.top = (p.y / 80000 * 160) + 'px';

        checkCơDuyên();
        requestAnimationFrame(loop);
    }

    init();
</script>
</body>
</html>
