<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>VÕ LÂM SUPREME - FULL INTERFACE 2026</title>
    <style>
        :root {
            --gold: #FFD700; --red: #FF3131; --blue: #00CCFF; --green: #39FF14;
            --purple: #BC13FE; --panel: rgba(10, 10, 10, 0.95); --border: 2px solid var(--gold);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Tahoma', sans-serif; color: #fff; }

        /* --- WORLD ENGINE --- */
        #game-stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #050505; }
        #world { position: absolute; width: 100000px; height: 100000px; background-image: radial-gradient(#111 2px, transparent 2px); background-size: 80px 80px; will-change: transform; }

        /* --- STICKMAN BONE SYSTEM (HIGH DETAIL) --- */
        .entity { position: absolute; width: 60px; height: 100px; z-index: 100; pointer-events: none; }
        .stickman { position: relative; width: 100%; height: 100%; transform-origin: bottom center; }
        .head { position: absolute; width: 28px; height: 28px; border: 3px solid #fff; border-radius: 50%; top: 0; left: 16px; background: #000; box-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .torso { position: absolute; width: 4px; height: 42px; background: #fff; top: 28px; left: 28px; border-radius: 2px; }
        .arm { position: absolute; width: 3px; height: 25px; background: #fff; top: 32px; left: 28px; transform-origin: top; }
        .leg { position: absolute; width: 4px; height: 32px; background: #fff; top: 70px; left: 28px; transform-origin: top; }
        
        .aura { position: absolute; inset: -35px; border: 2px solid var(--gold); border-radius: 50%; border-top-color: transparent; animation: spin 2s linear infinite; display: none; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .is-vip .aura { display: block; }

        /* --- UI PANEL SYSTEM (THU RA THU VÀO) --- */
        .window { position: fixed; background: var(--panel); border: var(--border); border-radius: 8px; z-index: 1000; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden; box-shadow: 0 0 20px #000; }
        .window-header { background: var(--gold); color: #000; padding: 5px 10px; font-weight: bold; font-size: 12px; display: flex; justify-content: space-between; cursor: pointer; }
        .window-content { padding: 10px; height: calc(100% - 25px); overflow-y: auto; }
        .minimized { height: 25px !important; width: 120px !important; opacity: 0.8; }

        /* Vị trí cụ thể các Panel */
        #minimap-panel { top: 20px; right: 20px; width: 180px; height: 180px; }
        #inventory-panel { bottom: 200px; right: 20px; width: 220px; height: 300px; }
        #shop-panel { top: 20px; left: 400px; width: 250px; height: 350px; }
        #chat-panel { bottom: 30px; left: 20px; width: 350px; height: 150px; }
        
        /* Nội dung MiniMap */
        #minimap-view { width: 100%; height: 100%; background: #000; position: relative; border: 1px solid #333; }
        #mini-hero { width: 6px; height: 6px; background: var(--green); border-radius: 50%; position: absolute; }

        /* HUD & Status */
        .hud-status { position: fixed; top: 20px; left: 20px; width: 350px; z-index: 900; background: var(--panel); border: var(--border); padding: 15px; border-radius: 12px; }
        .bar-wrap { width: 100%; height: 12px; background: #222; border-radius: 6px; margin: 8px 0; overflow: hidden; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.3s; }

        /* Bong bóng chat nhân vật */
        .chat-bubble { position: absolute; top: -110px; left: 50%; transform: translateX(-50%) scale(0); background: #fff; color: #000; padding: 8px 15px; border-radius: 15px; font-weight: bold; transition: 0.3s; z-index: 500; border: 2px solid var(--gold); white-space: nowrap; }
        .chat-bubble.active { transform: translateX(-50%) scale(1); }

        /* Skill & Controls */
        .action-zone { position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column; align-items: flex-end; gap: 15px; }
        .main-atk { width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(var(--red), #400); border: 5px solid #fff; color: #fff; font-size: 28px; font-weight: 900; cursor: pointer; box-shadow: 0 0 30px rgba(255,0,0,0.5); }
        
        #joy-base { position: fixed; bottom: 50px; left: 400px; width: 160px; height: 160px; background: rgba(255,255,255,0.02); border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; }
        #joy-stick { position: absolute; width: 70px; height: 70px; background: var(--gold); border-radius: 50%; top: 45px; left: 45px; box-shadow: 0 0 20px var(--gold); }

        /* Dmg & FX */
        .dmg { position: absolute; color: var(--gold); font-size: 30px; font-weight: 900; animation: floatUp 0.8s forwards; text-shadow: 2px 2px #000; }
        @keyframes floatUp { to { transform: translateY(-100px); opacity: 0; } }
    </style>
</head>
<body>
<div id="game-stage">
    <div id="world">
        <div id="layer-ents">
            <div id="hero" class="entity">
                <div class="aura"></div>
                <div class="stickman" id="hero-body">
                    <div class="chat-bubble" id="hero-chat"></div>
                    <div style="position:absolute; top:-40px; width:150px; left:-45px; text-align:center; color:var(--gold); font-weight:bold;">[VIP] ĐẠI HIỆP</div>
                    <div class="head" style="border-color: var(--gold);"></div>
                    <div class="torso"></div>
                    <div class="arm l"></div><div class="arm r"></div>
                    <div class="leg l"></div><div class="leg r"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="hud-status">
    <div style="display:flex; justify-content:space-between">
        <b>ĐẠI HIỆP TRUYỀN KỲ</b>
        <span>Cấp: <b id="ui-lv" style="color:var(--green)">1</b></span>
    </div>
    <div class="bar-wrap"><div id="hp-bar" class="bar-fill" style="background:var(--red)"></div></div>
    <div class="bar-wrap"><div id="exp-bar" class="bar-fill" style="background:var(--green); width:0%"></div></div>
    <div style="font-size:12px; display:flex; justify-content:space-between">
        <span>Lực chiến: <b id="ui-pow">2,500</b></span>
        <span>Ngân lượng: <b id="ui-money" style="color:yellow">5,000</b></span>
    </div>
</div>

<div id="minimap-panel" class="window">
    <div class="window-header" onclick="toggleWindow('minimap-panel')">
        <span>🗺️ BẢN ĐỒ</span> <span>[_]</span>
    </div>
    <div class="window-content">
        <div id="minimap-view"><div id="mini-hero"></div></div>
    </div>
</div>

<div id="inventory-panel" class="window">
    <div class="window-header" onclick="toggleWindow('inventory-panel')">
        <span>🎒 HÀNH TRANG</span> <span>[_]</span>
    </div>
    <div class="window-content" id="inv-list">
        <div style="font-size:11px; color:#888">Trống...</div>
    </div>
</div>

<div id="shop-panel" class="window">
    <div class="window-header" onclick="toggleWindow('shop-panel')">
        <span>💰 CỬA HÀNG VIP</span> <span>[_]</span>
    </div>
    <div class="window-content" id="shop-list"></div>
</div>

<div id="chat-panel" class="window">
    <div class="window-header" onclick="toggleWindow('chat-panel')">
        <span>💬 KIẾM HIỆP CHAT</span> <span>[_]</span>
    </div>
    <div class="window-content" id="chat-log" style="font-size:12px; color:var(--blue)">
        [Hệ thống]: Chào mừng Đại hiệp trở lại giang hồ!
    </div>
</div>

<div id="joy-base"><div id="joy-stick"></div></div>

<div class="action-zone">
    <button class="main-atk" onmousedown="Engine.atk()">ĐÁNH</button>
</div>

<script>
/**
 * DỮ LIỆU GAME (DATABASE)
 */
const DB = {
    mobs: [
        { name: 'Thổ Phỉ', hp: 500, lv: 5, color: '#f44' },
        { name: 'Ác Tăng', hp: 2000, lv: 25, color: '#f80' },
        { name: 'Kiếm Khách', hp: 5000, lv: 50, color: '#a0f' }
    ],
    items: [
        { name: 'Đồ Long Đao', price: 1000, pow: 500, icon: '⚔️' },
        { name: 'Ỷ Thiên Kiếm', price: 1200, pow: 600, icon: '🗡️' },
        { name: 'Cẩm Y Vệ', price: 2000, pow: 1000, icon: '👘' },
        { name: 'Thần Mã', price: 5000, pow: 2500, icon: '🐎' }
    ]
};

let player = {
    x: 5000, y: 5000, lv: 1, exp: 0, next: 100, hp: 1000, maxHp: 1000,
    money: 5000, pow: 2500, inv: [], dirX: 0, dirY: 0, anim: 0
};

let enemies = [];
    const Engine = (() => {
    const init = () => {
        // Tạo shop
        const sList = document.getElementById('shop-list');
        DB.items.forEach(it => {
            const btn = document.createElement('div');
            btn.style = "background:#222; margin-bottom:5px; padding:8px; border:1px solid #444; cursor:pointer; font-size:12px;";
            btn.innerHTML = `${it.icon} ${it.name} <br> <span style="color:yellow">${it.price} vàng</span>`;
            btn.onclick = () => buyItem(it);
            sList.appendChild(btn);
        });

        // Spawn quái
        for(let i=0; i<100; i++) spawnMob();

        loop();
        setInterval(aiUpdate, 100);
        setInterval(worldChat, 5000);
    };

    const toggleWindow = (id) => {
        document.getElementById(id).classList.toggle('minimized');
    };

    const buyItem = (it) => {
        if(player.money >= it.price) {
            player.money -= it.price;
            player.inv.push(it);
            player.pow += it.pow;
            updateUI();
            logChat(`[Cửa hàng]: Bạn đã mua ${it.name}!`);
        } else {
            logChat(`[Hệ thống]: Không đủ tiền!`);
        }
    };

    const logChat = (msg) => {
        const log = document.getElementById('chat-log');
        log.innerHTML += `<div>${msg}</div>`;
        log.scrollTop = log.scrollHeight;
    };

    const spawnMob = () => {
        const m = DB.mobs[Math.floor(Math.random()*DB.mobs.length)];
        const x = Math.random()*90000+5000, y = Math.random()*90000+5000;
        const id = 'm-' + Math.random().toString(36).substr(2, 5);
        const html = `
            <div id="${id}" class="entity" style="left:${x}px; top:${y}px">
                <div class="stickman">
                    <div style="position:absolute; top:-30px; width:100px; left:-20px; text-align:center; font-size:10px; color:${m.color}">${m.name}</div>
                    <div class="head" style="border-color:${m.color}"></div>
                    <div class="torso" style="background:${m.color}"></div>
                    <div class="arm" style="left:28px; background:${m.color}"></div>
                    <div class="leg" style="left:28px; background:${m.color}"></div>
                </div>
            </div>`;
        document.getElementById('layer-ents').insertAdjacentHTML('beforeend', html);
        enemies.push({ id, x, y, hp: m.hp, lv: m.lv, color: m.color });
    };

    const atk = () => {
        const hChat = document.getElementById('hero-chat');
        hChat.innerText = "HÀYAAAA!!";
        hChat.classList.add('active');
        setTimeout(() => hChat.classList.remove('active'), 1000);

        enemies.forEach((en, i) => {
            if(Math.hypot(player.x - en.x, player.y - en.y) < 300) {
                const d = player.pow + Math.floor(Math.random()*500);
                en.hp -= d;
                popDmg(en.x, en.y, d);
                if(en.hp <= 0) {
                    document.getElementById(en.id).remove();
                    enemies.splice(i, 1);
                    player.exp += 50; player.money += 100;
                    updateUI();
                    spawnMob();
                }
            }
        });
    };

    const popDmg = (x, y, d) => {
        const el = document.createElement('div');
        el.className = 'dmg'; el.innerText = '-' + d;
        el.style.left = x+'px'; el.style.top = y+'px';
        document.getElementById('world').appendChild(el);
        setTimeout(() => el.remove(), 800);
    };

    const aiUpdate = () => {
        enemies.forEach(en => {
            if(Math.hypot(player.x - en.x, player.y - en.y) < 1000) {
                const a = Math.atan2(player.y - en.y, player.x - en.x);
                en.x += Math.cos(a)*6; en.y += Math.sin(a)*6;
                const el = document.getElementById(en.id);
                el.style.left = en.x+'px'; el.style.top = en.y+'px';
            }
        });
    };

    const updateUI = () => {
        if(player.exp >= player.next) {
            player.lv++; player.exp = 0; player.next *= 2;
            logChat(`[Hệ thống]: Chúc mừng bạn lên cấp ${player.lv}!`);
            if(player.lv >= 3) document.getElementById('hero').classList.add('is-vip');
        }
        document.getElementById('ui-lv').innerText = player.lv;
        document.getElementById('ui-pow').innerText = player.pow.toLocaleString();
        document.getElementById('ui-money').innerText = player.money.toLocaleString();
        document.getElementById('exp-bar').style.width = (player.exp/player.next*100)+'%';
        
        const inv = document.getElementById('inv-list');
        inv.innerHTML = player.inv.map(i => `<div style="padding:5px; border-bottom:1px solid #333">${i.icon} ${i.name}</div>`).join('');
    };

    const worldChat = () => {
        const msgs = ["Săn Boss Hỏa Kỳ Lân không?", "Cần tìm sư phụ...", "Shop đang giảm giá kìa!", "Ai solo không?"];
        logChat(`[Thế giới]: ${msgs[Math.floor(Math.random()*msgs.length)]}`);
    };

    const loop = () => {
        player.x += player.dirX * 25; player.y += player.dirY * 25;
        const h = document.getElementById('hero');
        h.style.left = player.x+'px'; h.style.top = player.y+'px';

        // Bone Anim
        if(Math.hypot(player.dirX, player.dirY) > 0.1) {
            player.anim += 0.3;
            const s = Math.sin(player.anim)*30;
            document.querySelectorAll('#hero .leg').forEach((l,i)=>l.style.transform=`rotate(${i==0?s:-s}deg)`);
            document.querySelectorAll('#hero .arm').forEach((a,i)=>a.style.transform=`rotate(${i==0?-s:s}deg)`);
            document.getElementById('hero-body').style.transform = `scaleX(${player.dirX > 0 ? 1 : -1})`;
        }

        // Camera & MiniMap
        document.getElementById('world').style.transform = `translate(${window.innerWidth/2 - player.x}px, ${window.innerHeight/2 - player.y}px)`;
        document.getElementById('mini-hero').style.left = (player.x/100000*100)+'%';
        document.getElementById('mini-hero').style.top = (player.y/100000*100)+'%';

        requestAnimationFrame(loop);
    };

    // Joystick logic
    const jB = document.getElementById('joy-base'), jS = document.getElementById('joy-stick');
    jB.ontouchmove = (e) => {
        const r = jB.getBoundingClientRect(), t = e.touches[0];
        let x = t.clientX - r.left - 80, y = t.clientY - r.top - 80;
        const d = Math.hypot(x,y); if(d > 60) { x*=60/d; y*=60/d; }
        jS.style.transform = `translate(${x}px,${y}px)`;
        player.dirX = x/60; player.dirY = y/60;
    };
    jB.ontouchend = () => { player.dirX = 0; player.dirY = 0; jS.style.transform = 'translate(0,0)'; };

    return { init, atk, toggleWindow };
})();

function toggleWindow(id) { Engine.toggleWindow(id); }
window.onload = Engine.init;
</script>
</body>
</html>
