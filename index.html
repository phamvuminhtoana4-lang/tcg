<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>VÕ LÂM SUPREME: AI EDITION</title>
    <style>
        :root {
            --gold: #FFD700; --silver: #C0C0C0; --ui-bg: rgba(15, 15, 15, 0.95);
            --hp-boss: #ff1100; --exp-color: #00ff88; --sect-color: #00d4ff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; color: #fff; }

        /* --- WORLD ENGINE --- */
        #viewport { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
        #map { 
            position: absolute; width: 100000px; height: 100000px; 
            background: #080808 radial-gradient(#1a1a1a 1px, transparent 1px); 
            background-size: 120px 120px; will-change: transform;
        }

        .island { 
            position: absolute; border-radius: 50%; border: 15px solid rgba(255,215,0,0.03);
            background: radial-gradient(circle, rgba(30,30,30,0.8), transparent);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .island-label { font-size: 160px; color: rgba(255,255,255,0.02); font-weight: 900; text-transform: uppercase; pointer-events: none; }

        /* --- ENTITIES (STICKMAN 2.0) --- */
        .entity { position: absolute; width: 50px; height: 70px; z-index: 100; pointer-events: none; transition: transform 0.1s; }
        .stickman { position: relative; width: 100%; height: 100%; }
        .head { position: absolute; width: 20px; height: 20px; border: 2.5px solid #fff; border-radius: 50%; top: 0; left: 15px; background: #000; }
        .body-line { position: absolute; width: 2.5px; height: 30px; background: #fff; top: 20px; left: 24px; }
        .arm { position: absolute; width: 22px; height: 2.5px; background: #fff; top: 25px; left: 24px; transform-origin: left; transition: 0.1s; }
        .leg { position: absolute; width: 22px; height: 2.5px; background: #fff; top: 48px; left: 24px; transform-origin: left; }
        
        .elite .head { border-color: #ff3300; box-shadow: 0 0 15px #ff3300; }
        .elite .body-line { background: #ff3300; }
        .boss { width: 150px; height: 220px; z-index: 200; }
        .boss .head { width: 60px; height: 60px; border-width: 6px; border-color: #ff0000; left: 45px; box-shadow: 0 0 30px #ff0000; }
        .boss .body-line { width: 8px; height: 100px; left: 71px; top: 60px; background: #ff0000; }

        @keyframes walk { 0% { transform: rotate(60deg); } 100% { transform: rotate(120deg); } }
        .moving .leg-l { animation: walk 0.2s infinite alternate !important; }
        .moving .leg-r { animation: walk 0.2s infinite alternate-reverse !important; }

        .bubble { position: absolute; top: -50px; left: 50%; transform: translateX(-50%) scale(0); background: #fff; color: #000; padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; white-space: nowrap; transition: 0.2s; border: 2px solid var(--gold); z-index: 200; }
        .bubble.show { transform: translateX(-50%) scale(1); }

        /* --- VFX & UI --- */
        .fx-aoe { position: absolute; border-radius: 50%; border: 4px solid var(--gold); background: rgba(255,215,0,0.1); transform: translate(-50%, -50%) scale(0); animation: aoe-anim 0.5s ease-out forwards; pointer-events: none; }
        @keyframes aoe-anim { to { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
        .fx-slash { position: absolute; width: 120px; height: 20px; background: linear-gradient(90deg, transparent, #fff, transparent); transform: translate(-50%, -50%); animation: slash-anim 0.2s linear forwards; pointer-events: none; }
        @keyframes slash-anim { 0% { opacity: 1; transform: translate(-50%, -50%) scaleX(0); } 100% { opacity: 0; transform: translate(-50%, -50%) scaleX(1.5); } }

        .hud-left { position: fixed; top: 20px; left: 20px; z-index: 1000; }
        .player-box { background: var(--ui-bg); border-left: 5px solid var(--gold); padding: 15px; border-radius: 0 10px 10px 0; min-width: 250px; }
        .bar-bg { width: 100%; height: 6px; background: #222; margin: 8px 0; border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; transition: width 0.3s; }
        
        #chat-window { position: fixed; bottom: 20px; left: 220px; width: 350px; height: 180px; background: rgba(0,0,0,0.8); border: 1px solid #333; border-radius: 10px; z-index: 1001; display: flex; flex-direction: column; }
        #chat-content { flex: 1; overflow-y: auto; padding: 8px; font-size: 11px; scrollbar-width: none; }
        
        #boss-hud { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); width: 500px; display: none; z-index: 1100; text-align: center; }
        .boss-hp-bg { width: 100%; height: 12px; background: #200; border: 1px solid #ff4444; border-radius: 6px; overflow: hidden; margin-top: 5px; }
        #boss-hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #600, #f00); transition: width 0.1s; }

        .menu-right { position: fixed; right: 20px; top: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1001; }
        .circle-btn { width: 60px; height: 60px; background: var(--ui-bg); border: 1px solid #333; border-radius: 50%; color: var(--gold); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: 0.2s; }
        .panel { position: fixed; right: 90px; top: 20px; width: 350px; height: 500px; background: var(--ui-bg); border: 1px solid #444; border-radius: 15px; display: none; flex-direction: column; padding: 20px; z-index: 1002; }
        
        #joy-base { position: fixed; bottom: 60px; left: 60px; width: 140px; height: 140px; background: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; z-index: 1005;}
        #joy-stick { position: absolute; width: 60px; height: 60px; background: rgba(255,255,255,0.15); border-radius: 50%; top: 40px; left: 40px; }
        .action-cluster { position: fixed; bottom: 40px; right: 40px; display: flex; flex-direction: column; gap: 20px; align-items: flex-end; z-index: 1005;}
        .main-atk { width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, #800, #300); border: 4px solid #fff; color: #fff; font-size: 22px; font-weight: bold; cursor: pointer; }
        .skill-grid { display: flex; gap: 12px; }
        .skill-node { width: 65px; height: 65px; border-radius: 50%; background: #151515; border: 2px solid var(--gold); color: var(--gold); font-size: 11px; font-weight: bold; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; }
        .cd-mask { position: absolute; bottom: 0; width: 100%; height: 0%; background: rgba(0,0,0,0.7); transition: height linear; }
        
        #radar { width: 100%; height: 250px; background: #000; border: 1px solid #333; position: relative; overflow: hidden; border-radius: 10px; }
        .dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; transform: translate(-50%, -50%); }
        #start-gate { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .gate-btn { padding: 20px 80px; background: none; border: 2px solid var(--gold); color: var(--gold); font-size: 24px; cursor: pointer; margin-top: 30px; }
        .rank-master { color: #ff0000 !important; text-shadow: 0 0 5px #ff0000; }
    </style>
</head>
<body>
<div id="start-gate">
    <h1 style="color:var(--gold); font-size: 60px; margin:0;">VÕ LÂM SUPREME</h1>
    <p style="letter-spacing: 15px; color: #555;">TIẾU NGẠO GIANG HỒ</p>
    <button class="gate-btn" onclick="startGame()">BƯỚC VÀO GIANG HỒ</button>
</div>

<div id="boss-hud">
    <div id="boss-title" style="color:#ff4444; font-weight:bold;">MA VƯƠNG CHIẾN THẦN (LV.99)</div>
    <div class="boss-hp-bg"><div id="boss-hp-fill"></div></div>
</div>

<div id="viewport">
    <div id="map">
        <div id="sect-layer"></div>
        <div id="npc-layer"></div>
        <div id="mob-layer"></div>
        <div id="hero" class="entity">
            <div class="stickman">
                <div class="head" style="border-color: var(--gold); box-shadow: 0 0 10px var(--gold);"></div>
                <div class="body-line"></div>
                <div class="arm" id="arm-l" style="transform: rotate(150deg);"></div>
                <div class="arm" id="arm-r" style="transform: rotate(-30deg);"></div>
                <div class="leg leg-l" style="transform: rotate(110deg);"></div>
                <div class="leg leg-r" style="transform: rotate(70deg);"></div>
            </div>
        </div>
    </div>
</div>

<div class="hud-left">
    <div class="player-box">
        <div style="display:flex; justify-content:space-between; align-items:flex-end;">
            <span id="ui-sect" style="color:var(--gold); font-weight:bold; font-size:20px;">Vô Danh</span>
            <span>Cấp <span id="ui-lv">1</span></span>
        </div>
        <div class="bar-bg"><div id="ui-exp" class="bar-fill" style="background: var(--exp-color);"></div></div>
        <div style="display:flex; justify-content:space-between; font-size:14px; margin-top:5px;">
            <span>Bạc: <b id="ui-money">0</b></span>
            <span>LC: <b id="ui-pow" style="color:var(--gold)">10</b></span>
        </div>
        <div style="font-size:10px; color:#444; margin-top:10px;">Tọa độ: <span id="ui-x">0</span> | <span id="ui-y">0</span></div>
    </div>
</div>

<div id="chat-window">
    <div style="background:#1a1a1a; padding:4px 10px; font-size:10px; color:var(--gold); font-weight:bold;">GIANG HỒ CHAT (AI)</div>
    <div id="chat-content"></div>
</div>

<div class="menu-right">
    <div class="circle-btn" onclick="openPanel('pan-map')">🧭</div>
    <div class="circle-btn" onclick="openPanel('pan-shop')">🛒</div>
    <div class="circle-btn" onclick="openPanel('pan-bag')">🎒</div>
</div>

<div id="pan-map" class="panel">
    <div style="color: var(--gold); font-size: 20px; font-weight: bold; margin-bottom:15px;">THIÊN ĐỊA ĐỒ <span onclick="closePanels()" style="float:right; cursor:pointer">×</span></div>
    <div id="radar"><div id="radar-p" class="dot" style="background:red; border:1px solid #fff; z-index:10;"></div></div>
</div>

<div id="pan-shop" class="panel">
    <div style="color: var(--gold); font-size: 20px; font-weight: bold; margin-bottom:15px;">TIỆM RÈN TÔNG MÔN <span onclick="closePanels()" style="float:right; cursor:pointer">×</span></div>
    <div id="shop-content"></div>
</div>

<div id="pan-bag" class="panel">
    <div style="color: var(--gold); font-size: 20px; font-weight: bold; margin-bottom:15px;">HÀNH TRANG <span onclick="closePanels()" style="float:right; cursor:pointer">×</span></div>
    <div id="bag-content"></div>
</div>

<div id="joy-base"><div id="joy-stick"></div></div>
<div class="action-cluster">
    <div class="skill-grid" id="skill-bar"></div>
    <button class="main-atk" onclick="useSkill('Normal')">ĐÁNH</button>
</div>
    <script>
    const WORLD_SIZE = 100000;
    const SECTS = {
        'Thiếu Lâm': { x: 15000, y: 15000, color: '#f1c40f', item: 'Thiết Bổng', price: 200, pow: 50, skill: 'Sư Tử Hống', type: 'AOE', master: 'Huyền Từ Phương Trượng', elder: 'Vô Danh Thần Tăng', chats: ['Mô Phật, thiện tai thiện tai.', 'Thí chủ hãy quay đầu là bờ.'] },
        'Võ Đang': { x: 85000, y: 15000, color: '#3498db', item: 'Thanh Kiếm', price: 250, pow: 60, skill: 'Thái Cực Kiếm', type: 'PROJ', master: 'Trương Tam Phong', elder: 'Tống Viễn Kiều', chats: ['Đạo pháp tự nhiên.', 'Thái cực vô hình.'] },
        'Đường Môn': { x: 50000, y: 85000, color: '#2ecc71', item: 'Ám Khí', price: 300, pow: 55, skill: 'Bạo Vũ Lê Hoa', type: 'MULTI', master: 'Đường Lam', elder: 'Đường Ngạo Thiên', chats: ['Ám khí Đường Môn, độc nhất.', 'Ngươi trúng độc rồi!'] },
        'Nga Mi': { x: 15000, y: 85000, color: '#e91e63', item: 'Trầm Hương', price: 220, pow: 45, skill: 'Cửu Âm Trảo', type: 'BUFF', master: 'Diệt Tuyệt Sư Thái', elder: 'Chu Chỉ Nhược', chats: ['Băng thanh ngọc khiết.', 'Nga Mi kiếm pháp!'] },
        'Minh Giáo': { x: 85000, y: 55000, color: '#9b59b6', item: 'Thánh Lệnh', price: 450, pow: 80, skill: 'Càn Khôn Na Di', type: 'DASH', master: 'Trương Vô Kỵ', elder: 'Dương Tiêu', chats: ['Thánh hỏa hừng hực!', 'Quang minh vạn đại.'] },
        'Cái Bang': { x: 30000, y: 40000, color: '#e67e22', item: 'Đả Cẩu Bổng', price: 150, pow: 40, skill: 'Hàng Long Chưởng', type: 'AOE', master: 'Kiều Phong', elder: 'Hồng Thất Công', chats: ['Khà! Rượu ngon!', 'Đả cẩu bổng pháp!'] },
        'Thiên Long': { x: 70000, y: 70000, color: '#1abc9c', item: 'Ngọc Chỉ', price: 500, pow: 75, skill: 'Lục Mạch Kiếm', type: 'PROJ', master: 'Đoàn Chính Thuần', elder: 'Khô Diệp Thiền Sư', chats: ['Nhất Dương Chỉ!', 'Lục Mạch Thần Kiếm.'] },
        'Huyết Đao': { x: 10000, y: 50000, color: '#c0392b', item: 'Huyết Đao', price: 400, pow: 90, skill: 'Huyết Sát', type: 'BUFF', master: 'Huyết Đao Lão Tổ', elder: 'Địch Vân', chats: ['Sát! Máu phải rơi!', 'Huyết Đao vạn dặm.'] }
    };

    let player = { x: 2000, y: 2000, lv: 1, exp: 0, money: 0, pow: 10, speed: 13, sects: [], skills: [], items: [], cds: {}, dir: {x:0, y:0}, lastDir: {x:1, y:0}, isAtk: false };
    let mobs = [], boss = null, aiEntities = [];

    function startGame() {
        document.getElementById('start-gate').style.display = 'none';
        initMap(); spawnBoss(); initAI();
        for(let i=0; i<200; i++) spawnMob(Math.random() > 0.8 ? 'elite' : 'normal');
        requestAnimationFrame(gameLoop);
        setInterval(autoAIChat, 4000);
    }

    function initAI() {
        Object.keys(SECTS).forEach(sName => {
            const s = SECTS[sName];
            createAI(s.master, sName, 'Sư Phụ', s.x, s.y, s.color);
            createAI(s.elder, sName, 'Trưởng Lão', s.x + 300, s.y + 300, s.color);
            for(let i=0; i<10; i++) createAI(`Đệ tử ${sName}`, sName, 'Đệ tử', s.x + (Math.random()-0.5)*2000, s.y + (Math.random()-0.5)*2000, s.color);
        });
    }

    function createAI(name, sect, rank, x, y, color) {
        const id = 'ai-' + Math.random().toString(36).substr(2, 9);
        const html = `<div id="${id}" class="entity" style="left:${x}px; top:${y}px">
            <div class="bubble" id="b-${id}"></div>
            <div style="position:absolute; top:-35px; width:120px; left:-35px; text-align:center; font-size:10px; font-weight:bold; color:${color}">
                <span class="${rank==='Sư Phụ'?'rank-master':''}">[${rank}]</span><br>${name}
            </div>
            <div class="stickman"><div class="head" style="border-color:${color}"></div><div class="body-line" style="background:${color}"></div><div class="leg leg-l" style="background:${color}"></div><div class="leg leg-r" style="background:${color}"></div></div>
        </div>`;
        document.getElementById('npc-layer').insertAdjacentHTML('beforeend', html);
        aiEntities.push({ id, name, sect, rank, x, y, color, vx: Math.random()-0.5, vy: Math.random()-0.5 });
    }
                  </script>
                  <script>
    function useSkill(type) {
        if(player.cds[type] || player.isAtk) return;
        if(type === 'Normal') {
            player.isAtk = true;
            document.getElementById('arm-r').style.transform = 'rotate(70deg)';
            createFX(player.x + player.lastDir.x*50, player.y + player.lastDir.y*50, 'fx-slash');
            checkHit(200);
            setTimeout(() => { document.getElementById('arm-r').style.transform = 'rotate(-30deg)'; player.isAtk = false; }, 150);
        } else {
            const s = Object.values(SECTS).find(s => s.skill === type);
            if(s.type === 'AOE') { createFX(player.x, player.y, 'fx-aoe', 600); checkHit(600); }
            startCD(type, 4000);
        }
    }

    function checkHit(range) {
        mobs.forEach((m, i) => { if(Math.hypot(player.x - m.x, player.y - m.y) < range) damageMob(m, i, player.pow); });
        if(boss && Math.hypot(player.x - boss.x, player.y - boss.y) < range + 100) damageBoss(player.pow);
    }

    function damageMob(m, i, dmg) {
        m.hp -= dmg;
        if(m.hp <= 0) {
            document.getElementById(m.id).remove();
            player.exp += 15; player.money += 5; mobs.splice(i, 1); spawnMob(m.type); updateUI();
        }
    }

    function gameLoop() {
        player.x += player.dir.x * player.speed; player.y += player.dir.y * player.speed;
        const map = document.getElementById('map');
        map.style.transform = `translate(${window.innerWidth/2 - player.x}px, ${window.innerHeight/2 - player.y}px)`;
        const hero = document.getElementById('hero');
        hero.style.left = player.x + 'px'; hero.style.top = player.y + 'px';
        hero.classList.toggle('moving', Math.abs(player.dir.x) + Math.abs(player.dir.y) > 0.1);

        aiEntities.forEach(ai => {
            ai.x += ai.vx * 3; ai.y += ai.vy * 3;
            const el = document.getElementById(ai.id);
            if(Math.hypot(player.x - ai.x, player.y - ai.y) < 2000) {
                el.style.display = 'block'; el.style.left = ai.x + 'px'; el.style.top = ai.y + 'px';
            } else { el.style.display = 'none'; }
        });
        requestAnimationFrame(gameLoop);
    }

    // Các hàm phụ trợ khác (Radar, Shop, JoyStick...)
    function initMap() { /* (Đã có logic ở phần 3 gọi) */ }
    function spawnMob(type) { /* Logic tạo quái tương tự code cũ */ }
    function spawnBoss() { /* Logic tạo Boss tương tự code cũ */ }
    function openPanel(id) { closePanels(); document.getElementById(id).style.display = 'flex'; }
    function closePanels() { document.querySelectorAll('.panel').forEach(p => p.style.display = 'none'); }
    
    // Joystick 
    const joyBase = document.getElementById('joy-base');
    joyBase.addEventListener('touchstart', (e) => { 
        const touch = e.touches[0];
        const rect = joyBase.getBoundingClientRect();
        player.dir.x = (touch.clientX - (rect.left + 70))/40;
        player.dir.y = (touch.clientY - (rect.top + 70))/40;
    });
    window.addEventListener('touchend', () => player.dir = {x:0, y:0});

    function createFX(x, y, cls, size=120) {
        const f = document.createElement('div'); f.className = cls; f.style.left = x+'px'; f.style.top = y+'px';
        document.getElementById('map').appendChild(f); setTimeout(() => f.remove(), 500);
    }
</script>
</body>
</html>
