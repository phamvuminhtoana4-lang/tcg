<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Võ Lâm Tu Tiên - Cảnh Giới Phi Thăng</title>
    <style>
        :root {
            --gold: #FFD700; --hp: #FF3030; --stamina: #32CD32; --exp: #9933FF; --ui-bg: rgba(15, 10, 5, 0.95);
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Palatino", serif; color: #EEE; }

        /* WORLD MAP */
        #game-map { position: absolute; width: 15000px; height: 15000px; background: #0a0a0a radial-gradient(#1a1a1a 1px, transparent 1px); background-size: 50px 50px; transition: transform 0.1s linear; }

        /* ENTITIES */
        .entity { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; z-index: 50; }
        .sprite { width: 50px; height: 70px; border: 2px solid var(--gold); background: #222; border-radius: 5px; box-shadow: 0 0 10px var(--gold); }
        .boss-sprite { width: 150px; height: 150px; border-color: #FF0000; box-shadow: 0 0 50px #F00; background: #300; }
        
        /* CẢNH GIỚI FLOATING TEXT */
        .rank-tag { background: rgba(0,0,0,0.7); padding: 2px 8px; border-radius: 10px; font-size: 11px; color: var(--gold); margin-bottom: 5px; border: 1px solid var(--gold); }

        /* UI STATUS */
        .ui-top { position: fixed; top: 15px; left: 15px; background: var(--ui-bg); border: 2px ridge var(--gold); padding: 15px; width: 300px; z-index: 1000; border-radius: 5px; }
        .bar-container { width: 100%; height: 16px; background: #111; border: 1px solid #444; margin: 6px 0; position: relative; }
        .fill { height: 100%; transition: width 0.3s; }
        .centered-text { position: absolute; width: 100%; text-align: center; font-size: 10px; line-height: 16px; font-weight: bold; color: white; text-shadow: 1px 1px #000; }

        /* THÔNG BÁO ĐỘT PHÁ */
        #breakthrough-alert { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%); text-align: center; display: none; z-index: 2000; }
        .alert-title { font-size: 40px; color: #F00; font-weight: bold; text-shadow: 0 0 20px #F00; animation: pulse 1s infinite; }

        /* ACTION BAR */
        .action-bar { position: fixed; bottom: 0; width: 100%; height: 120px; display: flex; justify-content: center; align-items: center; gap: 15px; background: linear-gradient(transparent, #000); pointer-events: none; }
        .btn { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--gold); background: #2a1b0a; color: var(--gold); font-size: 11px; cursor: pointer; pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; }
        .btn-combat { width: 100px; height: 100px; background: #600; font-size: 18px; border-width: 4px; }

        @keyframes pulse { 0% { opacity: 0.5; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.1); } }
    </style>
</head>
<body onclick="moveHero(event)">

<div id="breakthrough-alert">
    <div class="alert-title">CẢNH BÁO ĐỘT PHÁ</div>
    <div style="font-size: 18px; color: var(--gold);">Đánh bại Thủ Vệ Cảnh Giới để Phi Thăng!</div>
</div>

<div id="game-map">
    <div id="hero" class="entity">
        <div id="hero-rank" class="rank-tag">Phàm Nhân</div>
        <div class="sprite"></div>
        <div id="hero-name" style="font-size: 13px; font-weight: bold; margin-top: 5px;">Đại Hiệp</div>
    </div>
    <div id="mob-layer"></div>
</div>

<div class="ui-top">
    <div id="ui-rank-display" style="font-size: 18px; color: var(--gold); font-weight: bold;">Cảnh giới: Phàm Nhân</div>
    <div id="ui-sect-info" style="font-size: 12px; color: #AAA;">Môn phái: Thiếu Lâm (Hệ Kim)</div>
    <div class="bar-container"><div id="hp-f" class="fill" style="background:var(--hp); width:100%"></div><div class="centered-text">SINH LỰC</div></div>
    <div class="bar-container"><div id="st-f" class="fill" style="background:var(--stamina); width:100%"></div><div class="centered-text">THỂ LỰC</div></div>
    <div class="bar-container"><div id="exp-f" class="fill" style="background:var(--exp); width:0%"></div><div class="centered-text">LINH KHÍ (EXP)</div></div>
    <div style="font-size: 11px; margin-top: 5px;">Cấp độ: <span id="ui-lv">1</span> | Lực chiến: <span id="ui-power">100</span></div>
</div>

<div class="action-bar">
    <div class="btn" onclick="setMode('horse')">CƯỠI NGỰA</div>
    <div class="btn btn-combat" onclick="attack()">CHIẾN</div>
    <div class="btn" onclick="rest()">THIỀN ĐỊNH</div>
</div>

<script>
    const RANKS = [
        "Phàm Nhân", "Luyện Khí Sơ Kỳ", "Luyện Khí Trung Kỳ", "Luyện Khí Viên Mãn", 
        "Trúc Cơ Sơ Kỳ", "Trúc Cơ Trung Kỳ", "Trúc Cơ Viên Mãn", 
        "Kim Đan Kỳ", "Nguyên Anh Kỳ", "Hóa Thần Kỳ", "Đại Thừa Kỳ"
    ];

    const SECTS = {
        'Thiếu Lâm': 'Kim', 'Thiên Vương': 'Kim', 'Đường Môn': 'Mộc', 'Ngũ Độc': 'Mộc',
        'Nga Mi': 'Thủy', 'Thúy Yên': 'Thủy', 'Cái Bang': 'Hỏa', 'Thiên Nhẫn': 'Hỏa',
        'Võ Đang': 'Thổ', 'Côn Lôn': 'Thổ'
    };

    let hero = {
        x: 7500, y: 7500, tx: 7500, ty: 7500,
        lv: 1, exp: 0, rankIdx: 0,
        hp: 1000, maxHp: 1000, st: 500, maxSt: 500,
        sect: 'Thiếu Lâm', isBossActive: false, mode: 'walk'
    };

    let mobs = [];

    function init() {
        const sects = Object.keys(SECTS);
        hero.sect = sects[Math.floor(Math.random() * sects.length)];
        document.querySelector('#ui-sect-info').innerText = `Môn phái: ${hero.sect} (Hệ ${SECTS[hero.sect]})`;
        spawnMobs(50);
        loop();
    }

    function spawnMobs(num) {
        for(let i=0; i<num; i++) {
            createEntity(Math.random()*15000, Math.random()*15000, false);
        }
    }

    function createEntity(x, y, isBoss) {
        let m = { x, y, hp: isBoss ? 5000 : 300, maxHp: isBoss ? 5000 : 300, boss: isBoss, id: Date.now() + Math.random() };
        let div = document.createElement('div');
        div.className = `entity ${isBoss ? 'boss' : ''}`;
        div.innerHTML = `
            ${isBoss ? '<div class="rank-tag">THỦ VỆ CẢNH GIỚI</div>' : ''}
            <div class="sprite ${isBoss ? 'boss-sprite' : ''}"></div>
            <div style="color:${isBoss ? 'red' : '#0F0'}; font-size:10px;">${isBoss ? 'TÂM MA BOSS' : 'Yêu Thú'}</div>
        `;
        document.getElementById('mob-layer').appendChild(div);
        m.dom = div;
        mobs.push(m);
    }

    function moveHero(e) {
        if(hero.st <= 0) return;
        const map = document.getElementById('game-map').getBoundingClientRect();
        hero.tx = e.clientX - map.left;
        hero.ty = e.clientY - map.top;
    }

    function attack() {
        mobs.forEach((m, idx) => {
            const d = Math.hypot(m.x - hero.x, m.y - hero.y);
            if(d < 250) {
                m.hp -= 150;
                if(m.hp <= 0) {
                    if(m.boss) {
                        hero.isBossActive = false;
                        hero.rankIdx++;
                        document.getElementById('breakthrough-alert').style.display = 'none';
                    }
                    m.dom.remove();
                    mobs.splice(idx, 1);
                    hero.exp += m.boss ? 0 : 25;
                    checkRank();
                }
            }
        });
    }

    function checkRank() {
        // Cứ mỗi khi đầy 100 EXP
        if(hero.exp >= 100) {
            hero.exp = 100; // Khóa EXP
            if(!hero.isBossActive) {
                spawnBoss();
            }
        }
    }

    function spawnBoss() {
        hero.isBossActive = true;
        document.getElementById('breakthrough-alert').style.display = 'block';
        createEntity(hero.x + 300, hero.y + 300, true);
    }

    function loop() {
        let speed = hero.mode === 'horse' ? 15 : 6;
        if(hero.st <= 0) speed = 2;

        const dist = Math.hypot(hero.tx - hero.x, hero.ty - hero.y);
        if(dist > 5) {
            const ang = Math.atan2(hero.ty - hero.y, hero.tx - hero.x);
            hero.x += Math.cos(ang) * speed;
            hero.y += Math.sin(ang) * speed;
            hero.st = Math.max(0, hero.st - (hero.mode === 'horse' ? 2 : 1));
        } else {
            hero.st = Math.min(hero.maxSt, hero.st + 1);
        }

        // AI BOSS Đuổi theo
        mobs.forEach(m => {
            if(m.boss) {
                const d = Math.hypot(hero.x - m.x, hero.y - m.y);
                if(d < 800) {
                    const ang = Math.atan2(hero.y - m.y, hero.x - m.x);
                    m.x += Math.cos(ang) * 4.5; m.y += Math.sin(ang) * 4.5;
                }
            }
            m.dom.style.left = m.x + 'px'; m.dom.style.top = m.y + 'px';
        });

        updateUI();
        requestAnimationFrame(loop);
    }

    function updateUI() {
        const hDom = document.getElementById('hero');
        const mapDom = document.getElementById('game-map');
        hDom.style.left = hero.x + 'px'; hDom.style.top = hero.y + 'px';
        mapDom.style.transform = `translate(${window.innerWidth/2 - hero.x}px, ${window.innerHeight/2 - hero.y}px)`;
        
        const rankName = RANKS[hero.rankIdx];
        document.getElementById('hero-rank').innerText = rankName;
        document.getElementById('ui-rank-display').innerText = `Cảnh giới: ${rankName}`;
        document.getElementById('exp-f').style.width = hero.exp + '%';
        document.getElementById('st-f').style.width = (hero.st/hero.maxSt*100) + '%';
        document.getElementById('ui-lv').innerText = hero.rankIdx * 10 + Math.floor(hero.exp/10);
        document.getElementById('ui-power').innerText = (hero.rankIdx + 1) * 1500;
    }

    function setMode(m) { hero.mode = m; }
    function rest() { hero.tx = hero.x; hero.ty = hero.y; hero.st = hero.maxSt; }

    init();
</script>
</body>
</html>
