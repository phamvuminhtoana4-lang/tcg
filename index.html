<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<title>Mobile Open World RPG</title>

<style>

body{
margin:0;
overflow:hidden;
touch-action:none;
}

#ui{
position:absolute;
top:10px;
left:10px;
color:white;
z-index:10;
}

#joystick{
position:absolute;
bottom:50px;
left:50px;
width:120px;
height:120px;
background:rgba(255,255,255,0.1);
border-radius:50%;
}

#stick{
width:60px;
height:60px;
background:rgba(255,255,255,0.5);
border-radius:50%;
position:absolute;
left:30px;
top:30px;
}

#attackBtn{
position:absolute;
bottom:60px;
right:60px;
width:80px;
height:80px;
background:red;
border-radius:50%;
color:white;
font-size:20px;
}

</style>

</head>

<body>

<div id="ui">
HP: <span id="hp"></span><br>
Level: <span id="level"></span>
</div>

<div id="joystick">
<div id="stick"></div>
</div>

<button id="attackBtn">⚔</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

<script>

////////////////////////////////////////////////////
// THREE SETUP
////////////////////////////////////////////////////

let scene = new THREE.Scene()
scene.background = new THREE.Color(0x87ceeb)

let camera = new THREE.PerspectiveCamera(
75, window.innerWidth/window.innerHeight, 0.1, 1000
)

let renderer = new THREE.WebGLRenderer()
renderer.setSize(window.innerWidth,window.innerHeight)
document.body.appendChild(renderer.domElement)

////////////////////////////////////////////////////
// LIGHT
////////////////////////////////////////////////////

let light = new THREE.DirectionalLight(0xffffff,1)
light.position.set(10,20,10)
scene.add(light)

////////////////////////////////////////////////////
// MAP
////////////////////////////////////////////////////

let ground = new THREE.Mesh(
new THREE.PlaneGeometry(300,300),
new THREE.MeshLambertMaterial({color:0x228B22})
)
ground.rotation.x = -Math.PI/2
scene.add(ground)

////////////////////////////////////////////////////
// PLAYER
////////////////////////////////////////////////////

let player = new THREE.Mesh(
new THREE.BoxGeometry(1,2,1),
new THREE.MeshLambertMaterial({color:0x0000ff})
)
player.position.y = 1
scene.add(player)

////////////////////////////////////////////////////
// STATS
////////////////////////////////////////////////////

let stats = {
hp:100,
level:1,
atk:10
}

////////////////////////////////////////////////////
// MONSTERS
////////////////////////////////////////////////////

let monsters = []

function spawnMonster(){

let m = new THREE.Mesh(
new THREE.BoxGeometry(1,2,1),
new THREE.MeshLambertMaterial({color:0xff0000})
)

m.position.set(
(Math.random()-0.5)*100,
1,
(Math.random()-0.5)*100
)

m.hp = 30

scene.add(m)
monsters.push(m)

}

for(let i=0;i<20;i++) spawnMonster()

////////////////////////////////////////////////////
// JOYSTICK
////////////////////////////////////////////////////

let joystick = document.getElementById("joystick")
let stick = document.getElementById("stick")

let moveX = 0
let moveZ = 0

joystick.addEventListener("touchmove", e => {

let rect = joystick.getBoundingClientRect()

let x = e.touches[0].clientX - rect.left - 60
let y = e.touches[0].clientY - rect.top - 60

let dist = Math.sqrt(x*x + y*y)
let max = 40

if(dist > max){
x = x/dist*max
y = y/dist*max
}

stick.style.left = (x+30) + "px"
stick.style.top = (y+30) + "px"

moveX = x/40
moveZ = y/40

})

joystick.addEventListener("touchend", () => {

stick.style.left = "30px"
stick.style.top = "30px"

moveX = 0
moveZ = 0

})

////////////////////////////////////////////////////
// ATTACK BUTTON
////////////////////////////////////////////////////

document.getElementById("attackBtn").onclick = () => {

monsters.forEach(m => {

let d = player.position.distanceTo(m.position)

if(d < 3){

m.hp -= stats.atk

if(m.hp <= 0){

scene.remove(m)
stats.level++

spawnMonster()

}

}

})

}

////////////////////////////////////////////////////
// GAME LOOP
////////////////////////////////////////////////////

camera.position.set(0,6,10)

function animate(){

requestAnimationFrame(animate)

// MOVE bằng joystick
player.position.x += moveX * 0.2
player.position.z += moveZ * 0.2

// CAMERA FOLLOW
camera.position.x = player.position.x
camera.position.z = player.position.z + 10
camera.lookAt(player.position)

// UI
document.getElementById("hp").innerText = stats.hp
document.getElementById("level").innerText = stats.level

renderer.render(scene,camera)

}

animate()

</script>

</body>
</html>
