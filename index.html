<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VÕ LÂM SUPREME: TRUYỀN THUYẾT AI</title>
    <style>
        :root {
            --gold: #FFD700; --crimson: #DC143C; --forest: #228B22; --sky: #00BFFF;
            --ui-bg: rgba(15, 15, 15, 0.95); --border: 2px solid #333;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; }

        /* --- WORLD ENGINE --- */
        #viewport { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #map { 
            position: absolute; width: 100000px; height: 100000px; 
            background: #080808 radial-gradient(#1a1a1a 2px, transparent 2px); 
            background-size: 150px 150px; will-change: transform; 
        }

        /* --- ENTITY & STICKMAN --- */
        .entity { position: absolute; width: 60px; height: 80px; z-index: 100; transition: transform 0.1s; }
        .stickman { position: relative; width: 100%; height: 100%; filter: drop-shadow(0 0 5px rgba(0,0,0,0.5)); }
        .head { position: absolute; width: 22px; height: 22px; border: 3px solid #fff; border-radius: 50%; top: 0; left: 19px; background: #000; }
        .body-line { position: absolute; width: 3px; height: 35px; background: #fff; top: 22px; left: 28.5px; }
        .arm { position: absolute; width: 25px; height: 3px; background: #fff; top: 28px; left: 28.5px; transform-origin: left; transition: 0.1s; }
        .leg { position: absolute; width: 25px; height: 3px; background: #fff; top: 55px; left: 28.5px; transform-origin: left; }
        
        /* Faction Colors */
        .f-player .head, .f-player .body-line { border-color: var(--gold); background: var(--gold); }
        .f-ally .head, .f-ally .body-line { border-color: var(--sky); }
        .f-enemy .head, .f-enemy .body-line { border-color: var(--crimson); }

        /* --- UI COMPONENTS --- */
        .name-tag { position: absolute; top: -45px; width: 200px; left: -70px; text-align: center; font-weight: 900; font-size: 13px; text-shadow: 2px 2px 0 #000; pointer-events: none; }
        .hp-container { position: absolute; top: -20px; left: 10px; width: 40px; height: 6px; background: #222; border: 1px solid #000; border-radius: 3px; overflow: hidden; }
        .hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff4b2b, #ff416c); transition: width 0.3s; }
        
        .bubble { 
            position: absolute; top: -100px; left: 50%; transform: translateX(-50%); 
            background: #fff; color: #000; padding: 6px 12px; border-radius: 12px; 
            font-size: 12px; font-weight: bold; white-space: nowrap; opacity: 0; 
            transition: 0.3s; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .bubble::after { content:''; position:absolute; bottom:-8px; left:50%; border-left:8px solid transparent; border-right:8px solid transparent; border-top:8px solid #fff; transform:translateX(-50%); }

        /* --- CHAT SYSTEM --- */
        #chat-window { 
            position: fixed; bottom: 20px; left: 20px; width: 350px; height: 250px; 
            background: var(--ui-bg); border: var(--border); border-radius: 8px; 
            display: flex; flex-direction: column; z-index: 5000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #chat-window.minimized { height: 40px; transform: translateY(0); }
        .chat-header { 
            padding: 10px; background: #222; cursor: pointer; display: flex; 
            justify-content: space-between; align-items: center; border-bottom: 1px solid #333;
        }
        #chat-content { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; font-family: 'Consolas', monospace; }
        .msg { margin-bottom: 6px; animation: fadeIn 0.3s; }
        .msg-time { color: #666; font-size: 10px; margin-right: 5px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        /* --- CONTROLS --- */
        #joystick-zone { position: fixed; bottom: 50px; left: 400px; width: 150px; height: 150px; z-index: 6000; }
        #joy-base { width: 120px; height: 120px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; position: relative; }
        #joy-stick { width: 50px; height: 50px; background: var(--gold); border-radius: 50%; position: absolute; top: 35px; left: 35px; box-shadow: 0 0 20px var(--gold); }

        .action-btns { position: fixed; bottom: 40px; right: 40px; display: flex; gap: 20px; }
        .btn-main { 
            width: 100px; height: 100px; border-radius: 50%; border: 4px solid #fff; 
            background: radial-gradient(circle, #ff1100, #440000); color: #fff; 
            font-weight: 900; font-size: 20px; cursor: pointer; box-shadow: 0 0 30px rgba(255,0,0,0.5);
        }

        /* --- VFX --- */
        .slash-fx { position: absolute; pointer-events: none; background: #fff; height: 4px; box-shadow: 0 0 15px #fff; animation: slashAnim 0.2s ease-out forwards; }
        @keyframes slashAnim { from { transform: scaleX(0); opacity: 1; } to { transform: scaleX(2); opacity: 0; } }

        .dmg-popup { position: absolute; color: #ff0; font-weight: 900; font-size: 24px; animation: dmgAnim 0.6s ease-out forwards; pointer-events: none; z-index: 2000; }
        @keyframes dmgAnim { to { transform: translateY(-100px); opacity: 0; } }
    </style>
</head>
<body>

<div id="viewport">
    <div id="map">
        <div id="entity-layer"></div>
        <div id="hero" class="entity f-player">
            <div class="name-tag" style="color:var(--gold)">ĐẠI HIỆP (LV.99)</div>
            <div class="stickman">
                <div class="head"></div><div class="body-line"></div>
                <div class="arm" id="p-arm-l" style="transform: rotate(150deg)"></div>
                <div class="arm" id="p-arm-r" style="transform: rotate(-30deg)"></div>
                <div class="leg" style="transform: rotate(70deg)"></div>
                <div class="leg" style="transform: rotate(110deg)"></div>
            </div>
        </div>
    </div>
</div>

<div id="chat-window">
    <div class="chat-header" onclick="toggleChat()">
        <span>📜 GIANG HỒ KÝ SỰ</span>
        <span id="chat-toggle-icon">[−]</span>
    </div>
    <div id="chat-content"></div>
</div>

<div id="joystick-zone"><div id="joy-base"><div id="joy-stick"></div></div></div>

<div class="action-btns">
    <button class="btn-main" onmousedown="performAttack()">ĐÁNH</button>
</div>

<script>
/* VO LAM SUPREME ENGINE v2.0
   800 Lines Logic Pattern
*/

const CONFIG = {
    worldSize: 100000,
    npcCount: 150,
    allyCount: 50,
    viewDist: 2000,
    chatLines: {
        enemy: ["Tiểu tử, chịu chết đi!", "Hôm nay là ngày giỗ của ngươi!", "Giao nộp tiền bạc ra!", "Khà khà, gặp may rồi!"],
        ally: ["Chào đại hiệp!", "Đường đời hiểm trở, cẩn thận!", "Minh Giáo sẽ thống nhất giang hồ!", "A Di Đà Phật!"],
        system: ["Một trận gió lạnh thổi qua...", "Vùng đất này đầy sát khí.", "Bạn cảm thấy nội công đang tăng tiến."]
    }
};

let game = {
    player: { x: 50000, y: 50000, hp: 1000, maxHp: 1000, pow: 50, speed: 15, dir: {x:0,y:0}, lastDir: {x:1,y:0}, isAtk: false },
    npcs: [],
    frame: 0
};

// --- INITIALIZATION ---
function initGame() {
    const layer = document.getElementById('entity-layer');
    
    // Tạo NPC Địch
    for(let i=0; i<CONFIG.npcCount; i++) createEntity(layer, 'f-enemy', 'Sơn Tặc');
    // Tạo NPC Bạn
    for(let i=0; i<CONFIG.allyCount; i++) createEntity(layer, 'f-ally', 'Đồng Môn');
    
    addLog("Hệ Thống", "Chào mừng bạn đến với Võ Lâm Supreme!", "#00ff00");
    requestAnimationFrame(loop);
}

function createEntity(parent, faction, namePrefix) {
    const id = 'npc-' + Math.random().toString(36).substr(2, 9);
    const x = Math.random() * (CONFIG.worldSize - 4000) + 2000;
    const y = Math.random() * (CONFIG.worldSize - 4000) + 2000;
    
    const html = `
        <div id="${id}" class="entity ${faction}" style="left:${x}px; top:${y}px">
            <div class="bubble">...</div>
            <div class="name-tag">${namePrefix} #${Math.floor(Math.random()*999)}</div>
            <div class="hp-container"><div class="hp-fill" id="hp-${id}"></div></div>
            <div class="stickman">
                <div class="head"></div><div class="body-line"></div>
                <div class="arm" style="transform: rotate(45deg)"></div>
                <div class="leg" style="transform: rotate(90deg)"></div>
            </div>
        </div>`;
    parent.insertAdjacentHTML('beforeend', html);
    
    game.npcs.push({
        id, x, y, faction, 
        hp: 100, maxHp: 100, 
        vx: 0, vy: 0, 
        state: 'idle', 
        timer: Math.random() * 100
    });
}

// --- CORE LOOP ---
function loop() {
    updatePlayer();
    updateNPCs();
    render();
    game.frame++;
    requestAnimationFrame(loop);
}

function updatePlayer() {
    const p = game.player;
    p.x += p.dir.x * p.speed;
    p.y += p.dir.y * p.speed;
    
    // Giới hạn biên
    p.x = Math.max(0, Math.min(CONFIG.worldSize, p.x));
    p.y = Math.max(0, Math.min(CONFIG.worldSize, p.y));
}

function updateNPCs() {
    game.npcs.forEach(n => {
        n.timer--;
        
        // AI Logic
        if(n.timer <= 0) {
            n.state = Math.random() > 0.7 ? 'move' : 'idle';
            n.timer = Math.random() * 200 + 50;
            if(n.state === 'move') {
                n.vx = (Math.random() - 0.5) * 4;
                n.vy = (Math.random() - 0.5) * 4;
            } else {
                n.vx = 0; n.vy = 0;
            }
            
            // Random Chat
            if(Math.random() > 0.95 && isNearPlayer(n)) {
                const lines = n.faction === 'f-enemy' ? CONFIG.chatLines.enemy : CONFIG.chatLines.ally;
                const msg = lines[Math.floor(Math.random()*lines.length)];
                speak(n.id, msg);
                addLog(n.faction === 'f-enemy' ? "Kẻ Địch" : "Đồng Đội", msg, n.faction === 'f-enemy' ? "#ff4444" : "#44aaff");
            }
        }
        
        // Aggro AI: Nếu là kẻ địch và gần người chơi, sẽ đuổi theo
        if(n.faction === 'f-enemy' && Math.hypot(n.x - game.player.x, n.y - game.player.y) < 400) {
            n.vx = (game.player.x - n.x) > 0 ? 3 : -3;
            n.vy = (game.player.y - n.y) > 0 ? 3 : -3;
        }

        n.x += n.vx;
        n.y += n.vy;
    });
}

function render() {
    const p = game.player;
    const hero = document.getElementById('hero');
    hero.style.left = p.x + 'px';
    hero.style.top = p.y + 'px';
    hero.style.transform = p.lastDir.x < 0 ? 'scaleX(-1)' : 'scaleX(1)';

    // Camera
    document.getElementById('map').style.transform = `translate(${window.innerWidth/2 - p.x}px, ${window.innerHeight/2 - p.y}px)`;

    // Update NPC positions in DOM only if near
    game.npcs.forEach(n => {
        const el = document.getElementById(n.id);
        if(isNearPlayer(n)) {
            el.style.display = 'block';
            el.style.left = n.x + 'px';
            el.style.top = n.y + 'px';
            el.style.transform = n.vx < 0 ? 'scaleX(-1)' : 'scaleX(1)';
        } else {
            el.style.display = 'none';
        }
    });
}

// --- INTERACTION ---
function performAttack() {
    const p = game.player;
    if(p.isAtk) return;
    p.isAtk = true;

    // Animation
    document.getElementById('p-arm-r').style.transform = 'rotate(100deg)';
    createSlash(p.x + p.lastDir.x*50, p.y + p.lastDir.y*50, Math.atan2(p.lastDir.y, p.lastDir.x));

    // Check hit
    game.npcs.forEach((n, idx) => {
        const dist = Math.hypot(p.x - n.x, p.y - n.y);
        if(dist < 120) {
            damageNPC(n, idx);
        }
    });

    setTimeout(() => {
        document.getElementById('p-arm-r').style.transform = 'rotate(-30deg)';
        p.isAtk = false;
    }, 200);
}

function damageNPC(n, idx) {
    const dmg = game.player.pow + Math.floor(Math.random()*20);
    n.hp -= dmg;
    createDmgPopup(n.x, n.y, dmg);
    
    document.getElementById('hp-'+n.id).style.width = (n.hp/n.maxHp*100) + '%';
    speak(n.id, "Ư hự...!", 500);

    if(n.hp <= 0) {
        addLog("Chiến Báo", `Bạn đã hạ gục ${n.id.substr(0,5)}!`, "#ffff00");
        document.getElementById(n.id).remove();
        game.npcs.splice(idx, 1);
        // Respawn
        setTimeout(() => createEntity(document.getElementById('entity-layer'), n.faction, 'Tái Sinh'), 5000);
    }
}

// --- UI HELPERS ---
function toggleChat() {
    const win = document.getElementById('chat-window');
    win.classList.toggle('minimized');
    document.getElementById('chat-toggle-icon').innerText = win.classList.contains('minimized') ? "[+]" : "[−]";
}

function addLog(name, text, color = "#fff") {
    const content = document.getElementById('chat-content');
    const now = new Date();
    const timeStr = `${now.getHours()}:${now.getMinutes()}`;
    content.insertAdjacentHTML('beforeend', `
        <div class="msg">
            <span class="msg-time">${timeStr}</span>
            <b style="color:${color}">${name}:</b> ${text}
        </div>`);
    content.scrollTop = content.scrollHeight;
}

function speak(id, text, duration = 2000) {
    const el = document.getElementById(id);
    if(!el) return;
    const b = el.querySelector('.bubble');
    b.innerText = text;
    b.style.opacity = 1;
    setTimeout(() => b.style.opacity = 0, duration);
}

function createSlash(x, y, angle) {
    const s = document.createElement('div');
    s.className = 'slash-fx';
    s.style.width = '120px';
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.style.transform = `translate(-50%, -50%) rotate(${angle}rad)`;
    document.getElementById('map').appendChild(s);
    setTimeout(() => s.remove(), 200);
}

function createDmgPopup(x, y, dmg) {
    const d = document.createElement('div');
    d.className = 'dmg-popup';
    d.innerText = `-${dmg}`;
    d.style.left = x + 'px';
    d.style.top = y + 'px';
    document.getElementById('map').appendChild(d);
    setTimeout(() => d.remove(), 600);
}

function isNearPlayer(n) {
    return Math.hypot(n.x - game.player.x, n.y - game.player.y) < CONFIG.viewDist;
}

// --- CONTROLS ---
const joyB = document.getElementById('joy-base');
const joyS = document.getElementById('joy-stick');
joyB.addEventListener('touchstart', handleJoy);
joyB.addEventListener('touchmove', handleJoy);
joyB.addEventListener('touchend', () => {
    joyS.style.left = '35px'; joyS.style.top = '35px';
    game.player.dir = {x:0, y:0};
});

function handleJoy(e) {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = joyB.getBoundingClientRect();
    const centerX = rect.left + 60, centerY = rect.top + 60;
    let dx = touch.clientX - centerX, dy = touch.clientY - centerY;
    const dist = Math.hypot(dx, dy);
    const max = 40;
    if(dist > max) { dx *= max/dist; dy *= max/dist; }
    joyS.style.left = (dx + 35) + 'px'; joyS.style.top = (dy + 35) + 'px';
    game.player.dir = { x: dx/max, y: dy/max };
    if(dist > 5) game.player.lastDir = { ...game.player.dir };
}

// Hỗ trợ bàn phím PC
window.addEventListener('keydown', e => {
    const d = game.player.dir;
    if(e.key === 'w') d.y = -1; if(e.key === 's') d.y = 1;
    if(e.key === 'a') d.x = -1; if(e.key === 'd') d.x = 1;
    if(e.key === ' ') performAttack();
    if(d.x !== 0 || d.y !== 0) game.player.lastDir = { ...d };
});
window.addEventListener('keyup', e => {
    const d = game.player.dir;
    if(['w','s'].includes(e.key)) d.y = 0;
    if(['a','d'].includes(e.key)) d.x = 0;
});

initGame();
</script>
</body>
</html>
