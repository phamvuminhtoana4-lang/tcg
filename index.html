<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<title>Open World Kiếm Hiệp</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial;
background:black;
}

#ui{
position:absolute;
top:10px;
left:10px;
color:white;
background:rgba(0,0,0,0.5);
padding:10px;
}

button{
margin:3px;
padding:8px;
}

</style>

</head>

<body>

<div id="ui">

HP: <span id="hp"></span><br>
Level: <span id="level"></span><br>
Gold: <span id="gold"></span><br>

<button onclick="attack()">Attack</button>
<button onclick="openInventory()">Inventory</button>
<button onclick="openShop()">Shop</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

<script>

////////////////////////////////////////////////////
//// GAME DATA
////////////////////////////////////////////////////

let stats = {

hp:100,
maxhp:100,

level:1,
exp:0,

gold:100,

atk:10,
def:5

}

////////////////////////////////////////////////////
//// INVENTORY
////////////////////////////////////////////////////

let inventory=[]

////////////////////////////////////////////////////
//// ITEMS
////////////////////////////////////////////////////

let items=[

{name:"Kiếm Gỗ",atk:5},

{name:"Thiết Kiếm",atk:10},

{name:"Long Kiếm",atk:20},

{name:"Thần Kiếm",atk:40}

]

////////////////////////////////////////////////////
//// THREE SETUP
////////////////////////////////////////////////////

let scene = new THREE.Scene()

scene.background=new THREE.Color(0x87ceeb)

let camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
)

let renderer = new THREE.WebGLRenderer()

renderer.setSize(window.innerWidth,window.innerHeight)

document.body.appendChild(renderer.domElement)

////////////////////////////////////////////////////
//// LIGHT
////////////////////////////////////////////////////

let light = new THREE.DirectionalLight(0xffffff,1)

light.position.set(20,40,20)

scene.add(light)

////////////////////////////////////////////////////
//// MAP GENERATOR
////////////////////////////////////////////////////

let mapSize=200

function generateMap(){

let geo=new THREE.PlaneGeometry(mapSize,mapSize,50,50)

let mat=new THREE.MeshLambertMaterial({

color:0x228B22,
wireframe:false

})

let ground=new THREE.Mesh(geo,mat)

ground.rotation.x=-Math.PI/2

scene.add(ground)

}

generateMap()

////////////////////////////////////////////////////
//// PLAYER
////////////////////////////////////////////////////

let player = new THREE.Mesh(

new THREE.BoxGeometry(1,2,1),
new THREE.MeshLambertMaterial({color:0x0000ff})

)

player.position.y=1

scene.add(player)

////////////////////////////////////////////////////
//// CAMERA FOLLOW
////////////////////////////////////////////////////

camera.position.set(0,6,10)

////////////////////////////////////////////////////
//// MONSTERS
////////////////////////////////////////////////////

let monsters=[]

function spawnMonster(){

let m=new THREE.Mesh(

new THREE.BoxGeometry(1,2,1),
new THREE.MeshLambertMaterial({color:0xff0000})

)

m.position.set(

(Math.random()-0.5)*mapSize,
1,
(Math.random()-0.5)*mapSize

)

m.hp=40+stats.level*10

scene.add(m)

monsters.push(m)

}

for(let i=0;i<40;i++){

spawnMonster()

}

////////////////////////////////////////////////////
//// BOSS
////////////////////////////////////////////////////

let boss

function spawnBoss(){

boss=new THREE.Mesh(

new THREE.BoxGeometry(3,4,3),
new THREE.MeshLambertMaterial({color:0x550000})

)

boss.position.set(0,2,-30)

boss.hp=500

scene.add(boss)

}

spawnBoss()

////////////////////////////////////////////////////
//// ATTACK
////////////////////////////////////////////////////

function attack(){

monsters.forEach(m=>{

let d=player.position.distanceTo(m.position)

if(d<2){

m.hp-=stats.atk

if(m.hp<=0){

scene.remove(m)

stats.exp+=20

stats.gold+=10

dropItem()

}

}

})

if(boss){

let d=player.position.distanceTo(boss.position)

if(d<4){

boss.hp-=stats.atk

if(boss.hp<=0){

scene.remove(boss)

stats.exp+=200

stats.gold+=200

spawnBoss()

}

}

}

levelUp()

}

////////////////////////////////////////////////////
//// LEVEL UP
////////////////////////////////////////////////////

function levelUp(){

let need=stats.level*100

if(stats.exp>=need){

stats.exp=0

stats.level++

stats.maxhp+=20

stats.atk+=5

stats.hp=stats.maxhp

}

}

////////////////////////////////////////////////////
//// DROP ITEM
////////////////////////////////////////////////////

function dropItem(){

if(Math.random()<0.3){

let item=items[Math.floor(Math.random()*items.length)]

inventory.push(item)

}

}

////////////////////////////////////////////////////
//// INVENTORY
////////////////////////////////////////////////////

function openInventory(){

let text="Inventory\n"

inventory.forEach((i,n)=>{

text+=n+" "+i.name+"\n"

})

let id=prompt(text+"Equip?")

if(id!==null){

equip(inventory[id])

}

}

function equip(item){

stats.atk+=item.atk

}

////////////////////////////////////////////////////
//// SHOP
////////////////////////////////////////////////////

function openShop(){

let c=prompt(

"Shop\n"+
"1 Heal 50\n"+
"2 Random sword 200"

)

if(c==1){

if(stats.gold>=50){

stats.gold-=50

stats.hp=stats.maxhp

}

}

if(c==2){

if(stats.gold>=200){

stats.gold-=200

dropItem()

}

}

}

////////////////////////////////////////////////////
//// DAILY UPDATE
////////////////////////////////////////////////////

function dailyUpdate(){

let today=new Date().getDate()

if(localStorage.day!=today){

localStorage.day=today

mapSize+=20

spawnMonster()

spawnMonster()

}

}

setInterval(dailyUpdate,60000)

////////////////////////////////////////////////////
//// MOVEMENT
////////////////////////////////////////////////////

let keys={}

window.addEventListener("keydown",e=>{

keys[e.key]=true

})

window.addEventListener("keyup",e=>{

keys[e.key]=false

})

////////////////////////////////////////////////////
//// SAVE
////////////////////////////////////////////////////

function save(){

localStorage.stats=JSON.stringify(stats)

localStorage.inv=JSON.stringify(inventory)

}

function load(){

if(localStorage.stats){

stats=JSON.parse(localStorage.stats)

inventory=JSON.parse(localStorage.inv)

}

}

load()

////////////////////////////////////////////////////
//// GAME LOOP
////////////////////////////////////////////////////

function animate(){

requestAnimationFrame(animate)

if(keys["w"]) player.position.z-=0.2
if(keys["s"]) player.position.z+=0.2
if(keys["a"]) player.position.x-=0.2
if(keys["d"]) player.position.x+=0.2

camera.position.x=player.position.x
camera.position.z=player.position.z+10

camera.lookAt(player.position)

document.getElementById("hp").innerText=stats.hp
document.getElementById("level").innerText=stats.level
document.getElementById("gold").innerText=stats.gold

renderer.render(scene,camera)

}

animate()

</script>

</body>
</html>
