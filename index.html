<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Kiếm Hiệp RPG</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

button{
padding:10px;
margin:5px;
background:#333;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#555;
}

#game{
max-width:700px;
margin:auto;
}

#log{
background:black;
height:200px;
overflow:auto;
padding:10px;
text-align:left;
}

.stat{
margin:5px;
}

</style>
</head>

<body>

<div id="game">

<h1>⚔ Game Kiếm Hiệp RPG ⚔</h1>

<div id="player"></div>

<div>

<button onclick="farm()">Farm Quái</button>
<button onclick="dungeon()">Phó Bản</button>
<button onclick="boss()">Boss</button>
<button onclick="shop()">Shop</button>
<button onclick="inventory()">Túi Đồ</button>

</div>

<h3>Log</h3>

<div id="log"></div>

</div>

<script>

////////////////////////////////////////////////////////
//// PLAYER
////////////////////////////////////////////////////////

let player = {

name:"Hiệp Khách",
level:1,
exp:0,
gold:100,

hp:120,
maxhp:120,

attack:10,
defense:5,

weapon:null,
inventory:[],
kills:0

}

////////////////////////////////////////////////////////
//// MONSTER
////////////////////////////////////////////////////////

let monsters = [

{name:"Thỏ Yêu",hp:50,atk:5},
{name:"Sói Đen",hp:80,atk:8},
{name:"Sơn Tặc",hp:120,atk:10},
{name:"Ma Kiếm",hp:160,atk:14}

]

////////////////////////////////////////////////////////
//// WEAPONS
////////////////////////////////////////////////////////

let weapons = [

{name:"Kiếm Gỗ",atk:5},
{name:"Thiết Kiếm",atk:10},
{name:"Long Kiếm",atk:20},
{name:"Thần Kiếm",atk:40}

]

////////////////////////////////////////////////////////
//// LOG
////////////////////////////////////////////////////////

function log(text){

let box=document.getElementById("log")

box.innerHTML += text+"<br>"

box.scrollTop=box.scrollHeight

}

////////////////////////////////////////////////////////
//// UPDATE UI
////////////////////////////////////////////////////////

function update(){

document.getElementById("player").innerHTML =

"Level: "+player.level+
" | HP: "+player.hp+"/"+player.maxhp+
" | Gold: "+player.gold+
" | ATK: "+player.attack

}

////////////////////////////////////////////////////////
//// LEVEL UP
////////////////////////////////////////////////////////

function gainExp(exp){

player.exp += exp

let need = player.level*100

if(player.exp >= need){

player.exp=0
player.level++

player.maxhp +=20
player.attack +=5
player.defense +=2

player.hp = player.maxhp

log("🔥 LÊN CẤP "+player.level)

}

}

////////////////////////////////////////////////////////
//// FARM
////////////////////////////////////////////////////////

function farm(){

let m = JSON.parse(JSON.stringify(

monsters[Math.floor(Math.random()*monsters.length)]

))

m.hp += player.level*20
m.atk += player.level*2

battle(m)

}

////////////////////////////////////////////////////////
//// BATTLE
////////////////////////////////////////////////////////

function battle(monster){

log("⚔ Gặp "+monster.name)

while(monster.hp>0 && player.hp>0){

monster.hp -= player.attack

log("Bạn đánh "+player.attack)

if(monster.hp<=0) break

let dmg = Math.max(1,monster.atk-player.defense)

player.hp -= dmg

log("Quái đánh "+dmg)

}

if(player.hp<=0){

log("💀 Bạn thua")

player.hp=player.maxhp

return

}

log("🎉 Thắng")

player.gold += 20
player.kills++

gainExp(30)

drop()

update()

}

////////////////////////////////////////////////////////
//// DROP ITEM
////////////////////////////////////////////////////////

function drop(){

if(Math.random()<0.3){

let w=weapons[Math.floor(Math.random()*weapons.length)]

player.inventory.push(w)

log("🗡 Nhặt "+w.name)

}

}

////////////////////////////////////////////////////////
//// INVENTORY
////////////////////////////////////////////////////////

function inventory(){

let text="Túi đồ:\n"

player.inventory.forEach((i,index)=>{

text += index+" "+i.name+"\n"

})

let id=prompt(text+"Nhập số để trang bị")

if(id!==null){

let item=player.inventory[id]

equip(item)

}

}

////////////////////////////////////////////////////////
//// EQUIP
////////////////////////////////////////////////////////

function equip(item){

player.weapon=item.name

player.attack += item.atk

log("Trang bị "+item.name)

update()

}

////////////////////////////////////////////////////////
//// SHOP
////////////////////////////////////////////////////////

function shop(){

let c=prompt(

"SHOP\n"+
"1 Hồi máu (50)\n"+
"2 Kiếm random (200)"

)

if(c==1){

if(player.gold>=50){

player.gold-=50

player.hp=player.maxhp

log("Đã hồi máu")

}

}

if(c==2){

if(player.gold>=200){

player.gold-=200

let w=weapons[Math.floor(Math.random()*weapons.length)]

player.inventory.push(w)

log("Mua "+w.name)

}

}

update()

}

////////////////////////////////////////////////////////
//// DUNGEON
////////////////////////////////////////////////////////

function dungeon(){

log("🔥 Vào phó bản")

for(let i=0;i<3;i++){

farm()

}

boss()

}

////////////////////////////////////////////////////////
//// BOSS
////////////////////////////////////////////////////////

function boss(){

let b={

name:"🐉 Ma Vương",
hp:300+player.level*50,
atk:20+player.level*5

}

battle(b)

}

////////////////////////////////////////////////////////
//// START
////////////////////////////////////////////////////////

update()

</script>

</body>
</html>
