<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Mobile RPG Full</title>

<style>
body{margin:0;overflow:hidden;touch-action:none}

#ui{
position:absolute;
top:10px;
left:10px;
color:white;
z-index:10;
}

#joystick{
position:absolute;
bottom:40px;
left:40px;
width:120px;
height:120px;
background:rgba(255,255,255,0.1);
border-radius:50%;
}

#stick{
width:60px;
height:60px;
background:rgba(255,255,255,0.6);
border-radius:50%;
position:absolute;
left:30px;
top:30px;
}

.btn{
position:absolute;
width:70px;
height:70px;
border-radius:50%;
color:white;
border:none;
}

#atk{right:40px;bottom:40px;background:red}
#skill{right:120px;bottom:120px;background:blue}
</style>
</head>

<body>

<div id="ui">
HP: <span id="hp"></span><br>
LV: <span id="lv"></span><br>
Gold: <span id="gold"></span>
</div>

<div id="joystick"><div id="stick"></div></div>

<button id="atk" class="btn">⚔</button>
<button id="skill" class="btn">🔥</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

<script>

//////////////////////
// SETUP
//////////////////////

let scene = new THREE.Scene()
scene.background = new THREE.Color(0x87ceeb)

let camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000)
let renderer = new THREE.WebGLRenderer({antialias:true})
renderer.setSize(innerWidth,innerHeight)
document.body.appendChild(renderer.domElement)

//////////////////////
// LIGHT
//////////////////////

let light = new THREE.DirectionalLight(0xffffff,1)
light.position.set(10,20,10)
scene.add(light)

//////////////////////
// MAP
//////////////////////

let ground = new THREE.Mesh(
new THREE.PlaneGeometry(300,300),
new THREE.MeshLambertMaterial({color:0x228B22})
)
ground.rotation.x = -Math.PI/2
scene.add(ground)

//////////////////////
// PLAYER
//////////////////////

let player = new THREE.Mesh(
new THREE.BoxGeometry(1,2,1),
new THREE.MeshLambertMaterial({color:0x0000ff})
)
player.position.y = 1
scene.add(player)

let data = {
hp:100,
lv:1,
gold:0,
atk:10
}

//////////////////////
// MONSTER
//////////////////////

let mobs = []

function spawnMob(){
let m = new THREE.Mesh(
new THREE.BoxGeometry(1,2,1),
new THREE.MeshLambertMaterial({color:0xff0000})
)

m.position.set((Math.random()-0.5)*100,1,(Math.random()-0.5)*100)
m.hp = 30

scene.add(m)
mobs.push(m)
}

for(let i=0;i<20;i++) spawnMob()

//////////////////////
// BOSS
//////////////////////

let boss = new THREE.Mesh(
new THREE.BoxGeometry(3,4,3),
new THREE.MeshLambertMaterial({color:0x990000})
)
boss.position.set(0,2,-30)
boss.hp = 300
scene.add(boss)

//////////////////////
// JOYSTICK
//////////////////////

let joy = document.getElementById("joystick")
let stick = document.getElementById("stick")

let moveX=0, moveZ=0
let dragging=false

joy.addEventListener("touchstart",()=>dragging=true)

joy.addEventListener("touchend",()=>{
dragging=false
moveX=0
moveZ=0
stick.style.left="30px"
stick.style.top="30px"
})

joy.addEventListener("touchmove",e=>{

if(!dragging) return

let rect = joy.getBoundingClientRect()

let x = e.touches[0].clientX - rect.left - 60
let y = e.touches[0].clientY - rect.top - 60

let d = Math.sqrt(x*x+y*y)
let max = 40

if(d>max){
x = x/d*max
y = y/d*max
}

stick.style.left = (x+30)+"px"
stick.style.top = (y+30)+"px"

moveX = x/max
moveZ = y/max

})

//////////////////////
// ATTACK
//////////////////////

document.getElementById("atk").onclick = ()=>{

mobs.forEach((m,i)=>{

if(player.position.distanceTo(m.position)<3){

m.hp -= data.atk

if(m.hp<=0){
scene.remove(m)
mobs.splice(i,1)
data.gold += 10
data.lv++
spawnMob()
}

}

})

// boss
if(player.position.distanceTo(boss.position)<4){
boss.hp -= data.atk
}

}

//////////////////////
// SKILL
//////////////////////

document.getElementById("skill").onclick = ()=>{

mobs.forEach(m=>{
if(player.position.distanceTo(m.position)<5){
m.hp -= 20
}
})

}

//////////////////////
// AI
//////////////////////

function mobAI(){

mobs.forEach(m=>{
let d = player.position.distanceTo(m.position)

if(d<20){
m.position.x += (player.position.x - m.position.x)*0.01
m.position.z += (player.position.z - m.position.z)*0.01
}

if(d<2){
data.hp -= 0.1
}

})

}

function bossAI(){

let d = player.position.distanceTo(boss.position)

if(d<30){
boss.position.x += (player.position.x - boss.position.x)*0.01
boss.position.z += (player.position.z - boss.position.z)*0.01
}

if(d<3){
data.hp -= 0.5
}

}

//////////////////////
// GAME LOOP
//////////////////////

camera.position.set(0,6,10)

function loop(){

requestAnimationFrame(loop)

// MOVE
player.position.x += moveX * 0.25
player.position.z += moveZ * 0.25

// CAMERA
camera.position.x = player.position.x
camera.position.z = player.position.z + 10
camera.lookAt(player.position)

// AI
mobAI()
bossAI()

// UI
document.getElementById("hp").innerText = Math.floor(data.hp)
document.getElementById("lv").innerText = data.lv
document.getElementById("gold").innerText = data.gold

renderer.render(scene,camera)

}

loop()

</script>

</body>
</html>
