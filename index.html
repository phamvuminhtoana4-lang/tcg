<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>KIẾM HIỆP GOD ENGINE</title>

<style>
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
canvas{display:block;margin:auto;background:#111}

#ui{
 position:fixed;
 top:10px;left:10px;
 background:#000c;
 padding:10px;
 border-radius:10px;
 width:260px;
}

.bar{
 width:100%;
 height:15px;
 background:#222;
 border-radius:10px;
 overflow:hidden;
 margin-bottom:5px;
}
.hp{background:red;height:100%}
.mana{background:blue;height:100%}
.exp{background:lime;height:100%}

#inventory{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:5px;
 margin-top:10px;
}
.slot{
 width:40px;height:40px;
 background:#222;
 border:1px solid #555;
 text-align:center;
 font-size:10px;
}

#minimap{
 position:fixed;
 right:10px;top:10px;
 width:150px;height:150px;
 background:#000a;
 border:2px solid #555;
}
</style>
</head>

<body>

<div id="ui">
HP<div class="bar"><div id="hpBar" class="hp"></div></div>
MP<div class="bar"><div id="mpBar" class="mana"></div></div>
EXP<div class="bar"><div id="expBar" class="exp"></div></div>

<p>Lv: <span id="lv">1</span></p>

<div id="inventory"></div>
</div>

<canvas id="minimap"></canvas>
<canvas id="game" width="1000" height="600"></canvas>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

const mini=document.getElementById("minimap");
const mctx=mini.getContext("2d");

let mouse={x:0,y:0};
c.onmousemove=e=>{
 let r=c.getBoundingClientRect();
 mouse.x=e.clientX-r.left;
 mouse.y=e.clientY-r.top;
};
  // WORLD
const world={w:6000,h:6000};
let cam={x:0,y:0};

// PLAYER FULL STATS
let p={
 x:3000,y:3000,
 hp:200,maxHp:200,
 mp:100,maxMp:100,
 lv:1,exp:0,nextExp:100,

 dmg:20,
 crit:0.2,
 speed:4,
 armor:5,

 inv:Array(25).fill(null),
 equip:{
  weapon:null,
  armor:null
 }
};

// INPUT
let keys={};
document.onkeydown=e=>keys[e.key.toLowerCase()]=true;
document.onkeyup=e=>keys[e.key.toLowerCase()]=false;

// INVENTORY UI
function renderInv(){
 let div=document.getElementById("inventory");
 div.innerHTML="";
 p.inv.forEach(it=>{
  div.innerHTML+=`<div class="slot">${it?it.type:""}</div>`;
 });
}

// ADD ITEM
function addItem(item){
 let idx=p.inv.findIndex(i=>!i);
 if(idx!==-1) p.inv[idx]=item;

 if(item.type==="weapon"){
  p.equip.weapon=item;
  p.dmg+=item.power;
 }
}
  let enemies=[];

// ENEMY TYPES
function spawnEnemy(type="melee"){
 let e={
  x:Math.random()*world.w,
  y:Math.random()*world.h,
  type,
  hp:100,maxHp:100,
  speed:2,
  dmg:0.3,
  range:30
 };

 if(type==="ranged"){
  e.range=200;
 }
 if(type==="elite"){
  e.hp=300;e.dmg=0.6;
 }
 if(type==="boss"){
  e.hp=2000;e.dmg=1;
 }

 enemies.push(e);
}

// SPAWN
for(let i=0;i<30;i++){
 let t=["melee","ranged","elite"][Math.floor(Math.random()*3)];
 spawnEnemy(t);
}
spawnEnemy("boss");

// AI UPDATE
function updateEnemy(e){
 let dx=p.x-e.x,dy=p.y-e.y;
 let d=Math.hypot(dx,dy);

 if(d<500){
  e.x+=dx/d*e.speed;
  e.y+=dy/d*e.speed;
 }

 if(d<e.range){
  p.hp-=e.dmg;
 }
}
  let effects=[];
let projectiles=[];

// 30 SKILL ADVANCED
let keysList="1234567890qwertyuiopasdfghjklzxcvbnm".split("").slice(0,30);
let skills={};

keysList.forEach((k,i)=>{
 skills[k]={
  cd:300+i*30,
  last:0,
  type:i%5,
  speed:5+i*0.5,
  color:`hsl(${i*12},100%,50%)`,
  dmg:10+i*4
 };
});

// USE SKILL
document.addEventListener("keydown",e=>{
 let k=e.key.toLowerCase();
 let s=skills[k];
 if(!s) return;

 if(Date.now()-s.last<s.cd) return;
 s.last=Date.now();

 let tx=mouse.x+cam.x;
 let ty=mouse.y+cam.y;

 // PROJECTILE
 projectiles.push({
  x:p.x,y:p.y,
  dx:(tx-p.x)/20,
  dy:(ty-p.y)/20,
  color:s.color,
  dmg:s.dmg,
  life:60
 });

 // EFFECT
 effects.push({
  x:tx,y:ty,
  r:10,
  color:s.color,
  life:20
 });
});
  function update(){

 // MOVE
 if(keys["w"]) p.y-=p.speed;
 if(keys["s"]) p.y+=p.speed;
 if(keys["a"]) p.x-=p.speed;
 if(keys["d"]) p.x+=p.speed;

 cam.x=p.x-c.width/2;
 cam.y=p.y-c.height/2;

 // ENEMY AI
 enemies.forEach(e=>{
  let dx=p.x-e.x,dy=p.y-e.y;
  let d=Math.hypot(dx,dy);

  if(d<500){
   e.x+=dx/d*e.speed;
   e.y+=dy/d*e.speed;
  }

  if(d<30) p.hp-=e.dmg;
 });

 // SKILL EFFECT
 effects.forEach((ef,i)=>{
  ef.life--;

  enemies.forEach(e=>{
   let d=Math.hypot(e.x-ef.tx,e.y-ef.ty);

   if(ef.type===0 && d<ef.range) e.hp-=ef.dmg;
   if(ef.type===1){ef.r+=6;if(Math.hypot(e.x-ef.x,e.y-ef.y)<ef.r) e.hp-=ef.dmg;}
   if(ef.type===2){e.hp-=ef.dmg*0.2;}
   if(ef.type===3){
    let sx=p.x+Math.cos(ef.life)*60;
    let sy=p.y+Math.sin(ef.life)*60;
    if(Math.hypot(e.x-sx,e.y-sy)<30) e.hp-=ef.dmg;
   }
   if(ef.type===4){
    p.x+=(ef.tx-p.x)/8;
    p.y+=(ef.ty-p.y)/8;
   }
   if(ef.type===5){
    if(d<ef.range*2) e.hp-=ef.dmg/2;
   }
  });

  if(ef.life<=0) effects.splice(i,1);
 });

 // KILL
 enemies=enemies.filter(e=>{
  if(e.hp<=0){
   dropItem(e.x,e.y);
   p.exp+=10;
   p.lv++;
   spawnEnemy();
   return false;
  }
  return true;
 });

 // PICK ITEM
 drops.forEach((it,i)=>{
  if(Math.hypot(p.x-it.x,p.y-it.y)<30){
   if(it.type==="hp") p.hp=Math.min(p.max,p.hp+30);
   else addItem(it);
   drops.splice(i,1);
  }
 });

 if(p.hp<=0){
  alert("💀 Respawn");
  p.hp=p.max;
  p.x=2500;p.y=2500;
 }

 document.getElementById("hpBar").style.width=(p.hp/p.max*100)+"%";
 document.getElementById("lv").innerText=p.lv;
}

function draw(){
 ctx.clearRect(0,0,c.width,c.height);

 // PLAYER
 ctx.fillStyle="cyan";
 ctx.fillRect(p.x-cam.x,p.y-cam.y,20,20);

 // ENEMY
 enemies.forEach(e=>{
  ctx.fillStyle=e.type==="boss"?"purple":"red";
  ctx.fillRect(e.x-cam.x,e.y-cam.y,20,20);

  ctx.fillStyle="black";
  ctx.fillRect(e.x-cam.x,e.y-cam.y-10,20,5);
  ctx.fillStyle="lime";
  ctx.fillRect(e.x-cam.x,e.y-cam.y-10,20*(e.hp/e.max),5);
 });

 // EFFECT
 effects.forEach(ef=>{
  ctx.strokeStyle=ef.color;
  ctx.fillStyle=ef.color;

  ctx.beginPath();
  ctx.arc(ef.tx-cam.x,ef.ty-cam.y,10,0,6.28);
  ctx.stroke();
 });

 // DROP
 drops.forEach(it=>{
  ctx.fillStyle=it.type==="hp"?"yellow":"orange";
  ctx.fillRect(it.x-cam.x,it.y-cam.y,10,10);
 });
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
